name: Release Instagram Images

on:
  pull_request:
    paths:
      - .github/workflows/release-instagram.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-instagram-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    name: Instagram release gate
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/deploy/prod' }}
    runs-on: arc-k8s
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify contract, focused tests and builds
        run: |
          pnpm security:dependency-contract
          pnpm contract:check
          pnpm --filter @mcp-socialmedia/instagram-connector test
          pnpm --filter @mcp-socialmedia/instagram-synapse-bridge test
          pnpm --filter @mcp-socialmedia/instagram-connector build
          pnpm --filter @mcp-socialmedia/instagram-synapse-bridge build

  release:
    needs: [gate]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/deploy/prod' }}
    permissions:
      contents: read
      id-token: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release.yml@e411d6a0f0ba9a9a0b4818836f3cf3a80db0102e
    with:
      runner: arc-k8s
      # Source-bound tag: dispatch cannot select or overwrite another release.
      # Deployment consumes the signed digest from release evidence, never tag.
      version: instagram-${{ github.sha }}
      images: |
        [
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-instagram-synapse-bridge","context":".","dockerfile":"connectors/instagram-synapse-bridge/Dockerfile"}
        ]
    secrets: inherit
