name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  s3-tests:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: arc-k8s
    env:
      RUN_S3_INTEGRATION: "1"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: skirmshop-drive-it
      S3_REGION: us-east-1
      S3_PREFIX: socialmedia
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      # 2026-09-13: dl.min.io returns 410 for every binary path now (public
      # downloads removed), so MinIO runs as its official container image on the
      # job's dind daemon instead of a downloaded binary. Not a services: block:
      # the Actions service schema has no way to pass the required
      # "server /data" command (actions/runner DockerCreate puts options
      # before the image and the image's default CMD does not start the
      # server). quay.io, not docker.io: anonymous docker.io pulls are
      # rate-limited on this egress (b5b8267).
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --address :9000
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs minio
          exit 1
      - uses: actions/setup-node@v4
        with:
          # Matches the images and the root engines field. Node 20 went EOL in
          # April 2026 and cannot run the pinned pnpm.
          node-version: "22"
      # corepack picks up packageManager (pnpm@11.18.0) from package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm --filter @mcp-socialmedia/server test --runInBand

  standard:
    needs: [s3-tests]
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@main
    with:
      runner: arc-k8s
      node_version: "22"
      pnpm_version: "11.17.0"
      docker_build_timeout: 12m
      kustomize_paths: k8s/overlays/stg k8s/overlays/prod
      images: |
        [
          {"name":"whatsappmcp-whatsapp-connector","context":".","dockerfile":"connectors/whatsapp-web/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-cloud-connector","context":".","dockerfile":"connectors/whatsapp-cloud/Dockerfile"},
          {"name":"whatsappmcp-telegram-connector","context":".","dockerfile":"connectors/telegram/Dockerfile"},
          {"name":"whatsappmcp-telegram-sync","context":".","dockerfile":"connectors/telegram-sync/Dockerfile"},
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-open-worker","context":".","dockerfile":"workers/whatsapp-open-worker/Dockerfile"},
          {"name":"whatsappmcp-mcp-server","context":".","dockerfile":"mcp-server/Dockerfile"}
        ]
    secrets: inherit
