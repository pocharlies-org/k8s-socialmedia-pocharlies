name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # ADR 0001 decision 5: per-account connectors are rendered from the registry.
  connectors-generated:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python3 scripts/render-connectors.py --check
      - run: python3 -m unittest scripts/test_render_connectors.py

  s3-tests:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: arc-k8s
    env:
      RUN_S3_INTEGRATION: "1"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: skirmshop-drive-it
      S3_REGION: us-east-1
      S3_PREFIX: socialmedia
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      # 2026-09-24: ni dl.min.io (410) ni quay.io/minio/minio (401 anónimo)
      # sirven ya la edición community: MinIO pasó a distribución solo-fuente.
      # Canal oficial: `go install`, fijado al último tag community (mismo
      # cambio que #61 en main). El binario AIStor no vale: sin licencia
      # arranca offline y deniega todas las operaciones S3.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"
          cache: false
      - name: Start MinIO
        run: |
          go install github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z
          mv "$(go env GOPATH)/bin/minio" /tmp/minio
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin /tmp/minio server /tmp/minio-data --address :9000 >/tmp/minio.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minio.log
          exit 1
      - uses: actions/setup-node@v4
        with:
          # Matches the images and the root engines field. Node 20 went EOL in
          # April 2026 and cannot run the pinned pnpm.
          node-version: "22"
      # corepack picks up packageManager (pnpm@11.18.0) from package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm --filter @mcp-socialmedia/server test --runInBand
      # SC-1225: the whatsapp-web connector suite (node:test) — credential-session,
      # the per-sub pairing pool and its internal API.
      - run: pnpm --filter @mcp-socialmedia/connector test

  standard:
    needs: [s3-tests]
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-ci.yml@main
    with:
      runner: arc-k8s
      node_version: "22"
      pnpm_version: "11.18.0"
      docker_build_timeout: 12m
      kustomize_paths: k8s/overlays/stg k8s/overlays/prod
      images: |
        [
          {"name":"whatsappmcp-whatsapp-connector","context":".","dockerfile":"connectors/whatsapp-web/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-cloud-connector","context":".","dockerfile":"connectors/whatsapp-cloud/Dockerfile"},
          {"name":"whatsappmcp-telegram-connector","context":".","dockerfile":"connectors/telegram/Dockerfile"},
          {"name":"whatsappmcp-telegram-sync","context":".","dockerfile":"connectors/telegram-sync/Dockerfile"},
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-open-worker","context":".","dockerfile":"workers/whatsapp-open-worker/Dockerfile"},
          {"name":"whatsappmcp-mcp-server","context":".","dockerfile":"mcp-server/Dockerfile"}
        ]
    secrets: inherit
