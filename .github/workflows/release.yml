name: Release Production

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag, for example v1.2.3
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical Socialmedia contract artifacts
        run: pnpm contract:check

  release:
    needs: [contract]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release.yml@e411d6a0f0ba9a9a0b4818836f3cf3a80db0102e
    with:
      runner: arc-k8s
      version: ${{ github.event.inputs.image_tag || github.ref_name }}
      images: |
        [
          {"name":"whatsappmcp-whatsapp-connector","context":".","dockerfile":"connectors/whatsapp-web/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-cloud-connector","context":".","dockerfile":"connectors/whatsapp-cloud/Dockerfile"},
          {"name":"whatsappmcp-telegram-connector","context":".","dockerfile":"connectors/telegram/Dockerfile"},
          {"name":"whatsappmcp-telegram-sync","context":".","dockerfile":"connectors/telegram-sync/Dockerfile"},
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-instagram-synapse-bridge","context":".","dockerfile":"connectors/instagram-synapse-bridge/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-open-worker","context":".","dockerfile":"workers/whatsapp-open-worker/Dockerfile"},
          {"name":"whatsappmcp-mcp-server","context":".","dockerfile":"mcp-server/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-synapse-bridge","context":".","dockerfile":"connectors/whatsapp-synapse-bridge/Dockerfile"}
        ]
    secrets: inherit

  manifests:
    needs: [release]
    permissions:
      contents: write
      pull-requests: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-manifest-release.yml@e411d6a0f0ba9a9a0b4818836f3cf3a80db0102e
    with:
      runner: arc-k8s
      source_path: k8s/overlays/prod
      artifact_name: k8s-socialmedia-pocharlies
      version: ${{ github.event.inputs.image_tag || github.ref_name }}
    secrets: inherit
