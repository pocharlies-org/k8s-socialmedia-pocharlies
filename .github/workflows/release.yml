name: Release Production

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag, for example v1.2.3
        required: false
        type: string

permissions:
  # contents: write is for the manifest job, which promotes the deploy branch.
  contents: write
  pull-requests: write
  # The shared reusable release requests id-token: write for keyless Sigstore
  # signing (gitops a75678a, 2026-07-14). A called workflow cannot exceed the
  # caller's permissions, so without this the run dies at startup
  # (startup_failure, 0s, no log).
  id-token: write

concurrency:
  group: release-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical Socialmedia contract artifacts
        run: pnpm contract:check

  release:
    needs: [contract]
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release.yml@5cbfd9dda2ce6b59342b9db834691ad5520768fd
    with:
      runner: arc-k8s
      version: ${{ github.event.inputs.image_tag || github.ref_name }}
      images: |
        [
          {"name":"whatsappmcp-whatsapp-connector","context":".","dockerfile":"connectors/whatsapp-web/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-cloud-connector","context":".","dockerfile":"connectors/whatsapp-cloud/Dockerfile"},
          {"name":"whatsappmcp-telegram-connector","context":".","dockerfile":"connectors/telegram/Dockerfile"},
          {"name":"whatsappmcp-telegram-sync","context":".","dockerfile":"connectors/telegram-sync/Dockerfile"},
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-open-worker","context":".","dockerfile":"workers/whatsapp-open-worker/Dockerfile"},
          {"name":"whatsappmcp-mcp-server","context":".","dockerfile":"mcp-server/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-app","context":"apps/whatsapp","dockerfile":"apps/whatsapp/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-synapse-bridge","context":".","dockerfile":"connectors/whatsapp-synapse-bridge/Dockerfile"},
          {"name":"whatsappmcp-correo-bridge","context":".","dockerfile":"connectors/correo-bridge/Dockerfile"},
          {"name":"whatsappmcp-sauvage-verificacion","context":".","dockerfile":"sauvage-verificacion/Dockerfile"}
        ]
    secrets: inherit

  manifests:
    needs: [release]
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-manifest-release.yml@5cbfd9dda2ce6b59342b9db834691ad5520768fd
    with:
      runner: arc-k8s
      source_path: k8s/overlays/prod
      artifact_name: k8s-socialmedia-pocharlies
      version: ${{ github.event.inputs.image_tag || github.ref_name }}
    secrets: inherit

  # INFRA-1500 (INFRA-540 P2 · C5) — guard de imágenes de la org (el reusable de
  # INFRA-536, k8s-gitops): hadolint sobre el Dockerfile + tamaño comprimido con
  # crane contra la baseline canónica. Patrón del job image-guard de
  # skirmshop-labels (release.yml). El reusable se consume FIJADO POR SHA (los
  # reusables de la org no se consumen @main). Sin HARBOR_USER/HARBOR_PASSWORD
  # crane muere en UNAUTHORIZED: homelab/* es privado (INFRA-1363). La matriz es
  # la misma lista de imágenes del job release, con las etiquetas IMAGE: y
  # DOCKERFILE: por imagen. En PRs no corre: el guard mide imágenes ya subidas
  # al registry (reusable-image-guard exige `imagen`); el build-check de las
  # imágenes en PR sigue en ci.yml (job standard, run_docker_build).
  # El host del input `imagen` es harbor.e-dani.com: es el que usa el consumidor
  # de referencia (skirmshop-labels) y contra el que INFRA-1363 validó las
  # credenciales del crane del guard (el login del reusable se hace al host de
  # `imagen`). harbor.lan.e-dani.com solo aparece en pasos de API (retención de
  # labels), no es el host del guard.
  image-guard:
    name: image-guard ${{ matrix.IMAGE }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - IMAGE: whatsappmcp-whatsapp-connector
            DOCKERFILE: connectors/whatsapp-web/Dockerfile
          - IMAGE: whatsappmcp-whatsapp-cloud-connector
            DOCKERFILE: connectors/whatsapp-cloud/Dockerfile
          - IMAGE: whatsappmcp-telegram-connector
            DOCKERFILE: connectors/telegram/Dockerfile
          - IMAGE: whatsappmcp-telegram-sync
            DOCKERFILE: connectors/telegram-sync/Dockerfile
          - IMAGE: whatsappmcp-instagram-connector
            DOCKERFILE: connectors/instagram/Dockerfile
          - IMAGE: whatsappmcp-whatsapp-open-worker
            DOCKERFILE: workers/whatsapp-open-worker/Dockerfile
          - IMAGE: whatsappmcp-mcp-server
            DOCKERFILE: mcp-server/Dockerfile
          - IMAGE: whatsappmcp-whatsapp-app
            DOCKERFILE: apps/whatsapp/Dockerfile
          - IMAGE: whatsappmcp-whatsapp-synapse-bridge
            DOCKERFILE: connectors/whatsapp-synapse-bridge/Dockerfile
          - IMAGE: whatsappmcp-correo-bridge
            DOCKERFILE: connectors/correo-bridge/Dockerfile
          - IMAGE: whatsappmcp-sauvage-verificacion
            DOCKERFILE: sauvage-verificacion/Dockerfile
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-image-guard.yml@ab1afdcb9fb4ce83ec55ce428bda1fb8f0a03bf9
    with:
      dockerfile: ${{ matrix.DOCKERFILE }}
      imagen: harbor.e-dani.com/homelab/${{ matrix.IMAGE }}:${{ github.event.inputs.image_tag || github.ref_name }}
      baseline: https://raw.githubusercontent.com/pocharlies-org/k8s-infra-pocharlies/main/docs/images/sizes-baseline.json
      modo: bloquear
      nombre: ${{ matrix.IMAGE }}
    secrets:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
