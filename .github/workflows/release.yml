name: Release Production

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag, for example v1.2.3
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical Socialmedia contract artifacts
        run: pnpm contract:check

  release:
    needs: [contract]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release.yml@96ec4d91e103d5b62159fe5ac3d5ae9f84340063
    with:
      runner: arc-k8s
      version: ${{ inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || format('social-{0}', github.sha) }}
      images: |
        [
          {"name":"whatsappmcp-whatsapp-connector","context":".","dockerfile":"connectors/whatsapp-web/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-cloud-connector","context":".","dockerfile":"connectors/whatsapp-cloud/Dockerfile"},
          {"name":"whatsappmcp-telegram-connector","context":".","dockerfile":"connectors/telegram/Dockerfile"},
          {"name":"whatsappmcp-telegram-sync","context":".","dockerfile":"connectors/telegram-sync/Dockerfile"},
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-instagram-synapse-bridge","context":".","dockerfile":"connectors/instagram-synapse-bridge/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-open-worker","context":".","dockerfile":"workers/whatsapp-open-worker/Dockerfile"},
          {"name":"whatsappmcp-mcp-server","context":".","dockerfile":"mcp-server/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-synapse-bridge","context":".","dockerfile":"connectors/whatsapp-synapse-bridge/Dockerfile"}
        ]
    secrets:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
      OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}

  manifests:
    needs: [release]
    permissions:
      contents: write
      pull-requests: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-manifest-pr-release.yml@96ec4d91e103d5b62159fe5ac3d5ae9f84340063
    with:
      runner: arc-k8s
      source_path: k8s/overlays/prod
      artifact_name: k8s-socialmedia-pocharlies
      version: ${{ inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || format('social-{0}', github.sha) }}
    secrets:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
      OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
