name: Release Production

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional explicit image tag, for example v1.2.3
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-prod-${{ github.repository }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: arc-k8s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify canonical Socialmedia contract artifacts
        run: pnpm contract:check

  release:
    needs: [contract]
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-release.yml@0b01dafa99fd5a8278b446e0b06c00e117598c53
    with:
      runner: arc-k8s
      version: ${{ inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || format('social-{0}', github.sha) }}
      images: |
        [
          {"name":"whatsappmcp-whatsapp-connector","context":".","dockerfile":"connectors/whatsapp-web/Dockerfile"},
          {"name":"whatsappmcp-telegram-connector","context":".","dockerfile":"connectors/telegram/Dockerfile"},
          {"name":"whatsappmcp-telegram-sync","context":".","dockerfile":"connectors/telegram-sync/Dockerfile"},
          {"name":"whatsappmcp-instagram-connector","context":".","dockerfile":"connectors/instagram/Dockerfile"},
          {"name":"whatsappmcp-instagram-synapse-bridge","context":".","dockerfile":"connectors/instagram-synapse-bridge/Dockerfile"},
          {"name":"whatsappmcp-mcp-server","context":".","dockerfile":"mcp-server/Dockerfile"},
          {"name":"whatsappmcp-whatsapp-synapse-bridge","context":".","dockerfile":"connectors/whatsapp-synapse-bridge/Dockerfile"}
        ]
    secrets:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
      OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}

  manifests:
    needs: [release]
    permissions:
      contents: write
      pull-requests: write
    uses: pocharlies-org/k8s-gitops-pocharlies/.github/workflows/reusable-manifest-pr-release.yml@0b01dafa99fd5a8278b446e0b06c00e117598c53
    with:
      runner: arc-k8s
      # The OCI artifact must include the overlay and its ../../base dependency.
      source_path: k8s
      artifact_name: k8s-socialmedia-pocharlies
      version: ${{ inputs.image_tag || (github.ref_type == 'tag' && github.ref_name) || format('social-{0}', github.sha) }}
      image_promotions: ${{ needs.release.outputs.release_images }}
      image_targets: |
        [
          {"name":"whatsappmcp-whatsapp-connector","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-whatsapp-connector","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-whatsapp-connector"},
          {"name":"whatsappmcp-telegram-connector","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-telegram-connector","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-telegram-connector"},
          {"name":"whatsappmcp-telegram-sync","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-telegram-sync","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-telegram-sync"},
          {"name":"whatsappmcp-instagram-connector","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-instagram-connector","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-instagram-connector"},
          {"name":"whatsappmcp-instagram-synapse-bridge","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-instagram-synapse-bridge","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-instagram-synapse-bridge"},
          {"name":"whatsappmcp-mcp-server","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-mcp-server","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-mcp-server"},
          {"name":"whatsappmcp-whatsapp-synapse-bridge","kind":"kustomize","path":"k8s/overlays/prod","matchName":"harbor.e-dani.com/homelab/whatsappmcp-whatsapp-synapse-bridge","deployRepository":"harbor.e-dani.com/homelab/whatsappmcp-whatsapp-synapse-bridge"}
        ]
    secrets:
      HARBOR_USER: ${{ secrets.HARBOR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      OPENCLAW_GITHUB_NOTIFY_URL: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_URL }}
      OPENCLAW_GITHUB_NOTIFY_TOKEN: ${{ secrets.OPENCLAW_GITHUB_NOTIFY_TOKEN }}
