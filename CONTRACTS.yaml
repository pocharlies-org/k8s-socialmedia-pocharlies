      [{displayName, phones (E.164, waid first), waids, organization?}]} —
      never the raw vCard. The path, the body fields and the 200 shape are
      contract: changing any is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_share_contact (mcp-server/src/mcp/server.ts canonicalShareContact; added later, surface unchanged).
