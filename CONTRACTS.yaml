      que llama a brain.ingest con `documents | native` y reintenta
      60s/10m/60m. Renombrar la clave, los campos de data o el mapeo
      cuenta→tenant es breaking: nueva entrada .v2.
  - id: amqp.synapse.brain-window-deleted.v1
    kind: routing-key
    value: brain_window.{tenant}.deleted
    role: provider
    files:
      - mcp-server/src/jobs/brain-windows-synapse.ts
    status: active
    note: >-
      INFRA-364. Mismo exchange, usuario y mapeo de tenant que
      amqp.synapse.brain-window-upserted.v1. Un evento por documento
      retirado (el padre y cada hijo '#cN'): {data: {adapter, source_id}},
      message_id UUID aleatorio (el borrado es idempotente en el brain).
      Consumidor: el workflow <tenant>.brain.conversation-window-deleted de
      pocharlies-org/synapse → brain.delete_document. Renombrar la clave o
      los campos es breaking: nueva entrada .v2.
  - id: mcp.socialmedia-tools.v2
    kind: mcp-tools
    value: socialmedia-tools
    role: publisher
    files:
      - scripts/generate-socialmedia-contract.ts
      - mcp-server/src/mcp/tool-registry.contract.spec.ts
    status: active
    note: >-
      El catálogo de tools MCP (73) se genera desde
      mcp-server/src/mcp/tool-registry.ts y el generador propaga el digest a cuatro
      puntos: contracts/socialmedia-tools.{json,md},
      mcp-server/src/mcp/contract.generated.ts y las dos anotaciones
      contracts.e-dani.com/socialmedia-digest de k8s/base/manifest.yaml. Su gate es
      `pnpm contract:check`. Consumidor: AgentGateway /social vende el catálogo en
      k8s-agentgateway-pocharlies/backends/social/socialmedia-tools.json y deriva de él su
      ledger CEL y su anotación de digest (scripts/generate-social-authorization.py
      --write, CI en modo --check): un bump del digest exige re-venderlo allí, y nada
      detecta la deriva (check-mcp-coverage.py compara la anotación contra su propia copia
      vendida). Los nombres de tool, effect, authScope y los esquemas nunca se renombran ni
      se borran: breaking es .vN+1 al lado; un cambio de solo descripción es `migrate`.
      INFRA-592: descripción de social_send_message.attachments[].url (ogg/opus → nota de
      voz nativa), digest sha256:e30a45214c5bc91b836454ccce87a4f9c515771cd8f51231ad8b0feb60c0993d.
      INFRA-635: aditivo, sin tocar el digest ni los esquemas. El envelope de
      social_search_messages (handleSearchMessages en server.ts) puede llevar
      meta.partialErrors y source.completeness 'partial' cuando una instancia del brain
      cae y otras contestan; la respuesta completa no cambia de forma.
