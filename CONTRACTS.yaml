    status: active
    note: >-
      POST /api/v1/messages/sticker of the house WhatsApp connectors (fase 3 /
      PR-9), consumed by dgx-messages (composer sticker picker). HMAC-signed
      body {conversationId, fileUrl (http(s) or data:), replyTo?, actor?}; no
      caption, no viewOnce. The file must be a WebP (static or animated) of at
      most 1 MiB — checked by its bytes (RIFF…WEBP); nothing is converted: 400
      invalid_request code sticker_not_webp | sticker_too_large |
      file_too_large | file_unavailable, before the socket and before the
      Idempotency-Key claim. Then 403 disabled_sending, 503 disconnected; the
      chat resolves to its canonical jid (merged tombstones / aliases) like
      messages-poll.v1. Answers 200 {sent: true, messageId, conversationId,
      sentAt, kind: 'sticker', animated}; opt-in Idempotency-Key (replay adds
      deduplicated: true, 409 idempotency_key_reused / send_outcome_uncertain).
      The row is written by the echo (messages.upsert) as STICKER. The path,
      the body fields and the 200 shape are contract: changing any is
      breaking — a new `.v2` entry beside this one.
