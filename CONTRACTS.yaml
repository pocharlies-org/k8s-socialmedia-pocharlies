      PR-9), consumed by dgx-messages (composer GIF). HMAC-signed body
      {conversationId, fileUrl, caption? (≤ 1024), replyTo?, actor?}. A GIF is
      an MP4 (…ftyp) of at most 16 MiB sent as a video with gifPlayback: true
      (WhatsApp's looping GIF); a .gif file is 400 invalid_request code
      gif_not_mp4 (the connector does not transcode), other refusals as
      messages-sticker.v1. Same gate, canonical chat, idempotency and 200
      shape as messages-sticker.v1 with kind: 'gif' (no animated). The row is
      written by the echo as VIDEO with metadata.gifPlayback: true (as is any
