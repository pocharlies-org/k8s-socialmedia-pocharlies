  - id: http.whatsapp-connector.groups-invite.v1
    kind: http-route
    value: /groups/invite
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/groups/invite of the house WhatsApp connectors: invite by
      private message (WhatsApp's "join group" card, Baileys groupInvite) the
      people WhatsApp would not add to a group — a 403 on
      groups-participants.v1 add, whose answer now also carries (additively;
      the v1 fields unchanged) inviteRequired [{participant, jid,
      privateInvite, inviteExpiresAt}] on the 200 and in the 422 details.
      Opt-in: nothing is invited automatically. HMAC-signed body {groupId,
      participants[], text?, actor?}: groupId a `…@g.us` (account prefix
      allowed); participants 1–20 phones or PN / LID jids (as groups-create.v1,
      smaller cap: each is a message to a real person); text an optional
      caption ≤ 1024. 400 invalid_request first, then the sending gate (403
      disabled_sending), then 503 disconnected. Fresh metadata: 403
      not_group_member / not_group_admin (admins only), 422
      community_unsupported, 422 self_participant. Per person: WhatsApp's
      private code from that refused add while this process still holds it
      and it has not expired (invite: private), else the group's invite link
      code (invite: link, card expiry 3 days); the card goes to the person's
      canonical chat (merged phone chat → its LID) with the chat's
      disappearing timer. Someone already in the group is reported
      (already_participant), not messaged. 200 {invited: true, groupId,
      results [{participant, jid, ok, reason (invited | already_participant |
      send_failed | invite_link_unavailable), invite (private | link | null),
      messageId}], succeeded, failed, partial}; nobody invited → 422
      invite_not_sent with {results, succeeded: 0, failed}. No DB write (the
      sent card's payload is kept for retries, ingest only). The path, the
      body fields, the 200 shape, the reasons and the failureClass values are
      contract: changing any is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_invite_to_group (mcp-server/src/mcp/server.ts canonicalInviteToGroup; added later, surface unchanged).
  - id: http.whatsapp-connector.messages-star.v1
    kind: http-route
    value: /messages/star
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/messages/star of the house WhatsApp connectors: star /
      unstar a message as the phone does, consumed by the MCP tool
      social_star_message (mcp-server/src/mcp/server.ts canonicalStarMessage).
      HMAC-signed body {conversationId?, messageId, star, actor?}: messageId
      bare or account-prefixed; conversationId optional (the message's key
      names its chat); star a boolean. 400 invalid_request first, then the
      sending gate (403 disabled_sending), then 503 disconnected. The key comes
      from memory, the durable payload, whatsapp_message_keys or the messages
      row (survives restarts); unknown message, or someone else's group message
      without its author → 404 message_unavailable. WhatsApp app-state patch in
      regular_high, index [star, chat, id, fromMe, author-of-a-group-message-
      not-ours | 0] (Baileys' chatModify star is not used); a WhatsApp 4xx →
      422 rejected_by_whatsapp (with `code`). Only this account sees it. Once
      accepted, recorded in whatsapp_message_stars (migration 018, ingest
      only). 200 {starred, messageId, conversationId, starredAt, persisted}
      (persisted false = not recorded: ingest off or 018 missing). Inbound: a
      star / unstar from our phone (messages.update starred) and the starred
      flag of a history-sync message (only for a message never seen) are
      recorded too. The path, the body fields, the 200 shape and the
      failureClass values are contract: changing any is breaking — a new
      `.v2` entry beside this one.
  - id: http.whatsapp-connector.messages-starred.v1
