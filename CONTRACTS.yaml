      ↔ LID yet), 422 rejected_by_whatsapp, 502 provider_invalid_response.
      No DB write. The path, the body fields and the 200 shape are contract:
      changing any is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_block_contact (mcp-server/src/mcp/server.ts canonicalBlockContact; added later, surface unchanged).
