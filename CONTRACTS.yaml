  - id: http.whatsapp-connector.chats-disappearing.v1
    kind: http-route
    value: /chats/disappearing
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/chats/disappearing of the house WhatsApp connectors (fase 3
      / PR-8), consumed by dgx-messages (chat detail → disappearing-messages
      selector, with confirmation). HMAC-signed body {conversationId,
      expiration, actor?}: expiration 0 | 86400 | 604800 | 7776000 seconds
      (or off | 24h | 7d | 90d) — anything else 400 invalid_request; chat as
