  - id: http.brain.push-ingest.conversation-window.v1
    kind: http-route
    value: /instances/{instance}/push-ingest
    anchor: conversation_window
    role: consumer
    files:
      - mcp-server/src/jobs/brain-windows-lib.ts
      - mcp-server/src/jobs/brain-windows.ts
      - mcp-server/src/jobs/brain-windows-backfill.ts
    status: active
    note: >-
      This repo is the CONSUMER; the provider is skirmshop-brain-v2 (service
      skirmshop-brain-ingest, ns skirmshop-brain-prod), which this repo must
      not rename. The brain-windows jobs (INFRA-364, ADR 0002) push, per
      account instance (personal|skirmshop from the account registry) and
      adapter (whatsapp|telegram), parent documents of metadata.type
      `conversation_window` (content = header + summary or header + first
      ~1500 chars; metadata carries conv_kind, window_key, part, start_ts, end_ts,
      observed_at, message_count, participants[], message_ids[], transcript,
      content_hash, llm_status, summary, extraction) plus child documents of
      metadata.type `conversation_chunk` (source_id = parent + '#cN';
      metadata carries window_source_id, chunk_index, observed_at,
      message_ids[]). Removed windows are deleted with
      POST /instances/{instance}/delete-document {adapter, source_id} (parent
      and each child). The brain's small-to-big retrieval (ADR 0002 §4) groups
      children by window_source_id and its hebbian graph (ADR 0002 §8) reads
      extraction/entities/topics: renaming a document type, a metadata key
      listed here, the '#cN' child suffix or the 'win:' source_id prefix is
      breaking against the provider — a new `.v2` entry beside this one, not
      an in-place edit. The per-message surface this replaces
      (metadata.type `message`, source ids wa:/tg:/ig:) is retired by the ADR
      0002 §9 purge; brain-ingest.ts / brain-replay.ts keep pushing it for
      recovery only. Behavior note (INFRA-364): the transcript is rendered
      from `messages.content`; a voice-note echo row that still stores the
      raw STT response body (`🎙️ "{"text":"…"}"`) is unwrapped to prose in
      renderLine before pushing — the document schema is untouched, only the
      transcript text is normalized. 2026-10-01 (INFRA-364): conv_kind
      (chat|group|channel|bot) listado entre las claves; el ledger brain_windows
      y el corte de sesiones del lado consumidor se corrigen sin cambiar la forma. Los textos se envian bien formados en UTF-16
      (sustitutos sueltos -> U+FFFD) para no abrir el circuit breaker del embedder. Desde el 01-10 las ventanas con conv_kind bot o channel se
      suben sin hijos conversation_chunk (solo el padre). Desde el 02-10 la
      `extraction` del padre se normaliza antes de validarla: un tipo de
      entidad fuera del enum se mapea a su sinónimo o esa entidad se omite,
      y las listas y el summary van recortados a sus topes. La forma y las
      claves no cambian.
      Desde el 01-10 el incremental (brain-windows.ts) ya no llama aqui
      por defecto: publica amqp.synapse.brain-window-*.v1 y Synapse hace el
      push-ingest con los MISMOS documentos; este camino queda para el
      backfill y como vuelta atras (BRAIN_WINDOWS_SINK=http).
      02-10-2026: el incremental solo borra ventanas del rango de sesiones
      que reconstruye (antes comparaba con todo el chat y borró ~26k
      ventanas) y nunca más de BRAIN_WINDOWS_MAX_DELETES_PER_CHAT (50) por
      chat y pasada. La forma de los documentos no cambia.
      02-10-2026: el presupuesto de la pasada es único para todas las cuentas
      (18 min); sin cambio de forma.
  - id: metric.brain-windows.refused-deletes.v1
