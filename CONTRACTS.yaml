# CONTRACTS.yaml — contract surface of k8s-socialmedia-pocharlies.
#
# This repo PUBLISHES HTTP routes that other processes call (social-api →
# whatsapp-pairing, the house QR flow → the whatsapp connector). Those names
# and shapes are contract: a rename or a shape edit breaks a consumer this
# repo's own tests cannot see. Created by SC-1225 (SC-1197 P1a, design D6);
# later parts of SC-1197 (P1b social-api, P2 status, P4b telegram) add their
# entries in the same push as the surface.
#
# The MCP tool contract stays where it is (contracts/socialmedia-tools.*,
# checked by `pnpm contract:check`); it is not duplicated here.
#
# Enforced by the generic checker — k8s-gitops-pocharlies/scripts/check-contracts.py
# — from the global pre-push hook and as a CI backstop.
#
# Lo existente NO muta. Breaking = entrada nueva `.vN+1`, la vieja a
# `status: deprecated` con `replaced_by` + `remove_after`. Las entradas nunca se
# borran (retirar = `status: removed`). Un commit que toca superficie de contrato
# actualiza el registry en el mismo push y lleva el trailer
# `Contract-Change: <accion> <id>`.
#
# Reglas completas y via de excepcion: skill `synapse-contracts`.
version: 1
canonical_checkout: /home/dibanez/k8s/k8s-socialmedia-pocharlies
registry_files:
  - CONTRACTS.yaml
contracts:
  - id: http.whatsapp-pairing.internal-sessions.v1
    kind: http-route
    value: /internal/whatsapp/sessions
    role: provider
    files:
      - connectors/whatsapp-web/src/pairing/app.ts
      - mcp-server/src/api/whatsapp-pairing-client.ts
    status: active
    note: >-
      Internal API of the whatsapp-pairing Deployment (whatsapp-connector image,
      :3001, in-cluster only), consumed by social-api (SC-1197 P1b). Three routes,
      all POST so the sessionKey travels inside the HMAC-signed body
      (connectors/whatsapp-web/src/api/auth.ts createHMACAuth: headers
      x-connector-timestamp + x-connector-signature = sha256=HMAC(secret,
      "<ts>:<JSON body>"), 5-minute window): /start, /state and /me under this
      base, each with body {"sessionKey": "<sub>"}. /start and /state answer 200
      {sessionKey, state, qr, me} with state one of starting|qr|paired|expired|unpaired,
      qr null or {value, dataUrl, issuedAt, expiresAt}, me null or {id, jid, phone,
      name}; /me answers 200 {sessionKey, me} or 404 {"error":"not_paired"}. Errors:
      400 {"error":"invalid_session_key"}; 401 bad or missing signature; 429
      {"error":"rate_limited", reason: start_interval|daily_starts|pool_full|qr_limit,
      retryAfterSeconds} with a Retry-After header; 503 {"error":"pairing_unavailable"}
      when the credential store is off, the master key is missing or no shared secret
      is set; 404 {"error":"not_found"} for everything but GET /health while
      SOCIAL_PAIRING_API is off. The base path, the methods, the body field, the state
      names, the error codes and the 429 reasons are all contract: renaming any of
      them, or moving the sessionKey out of the signed body, is breaking — a new
      `http.whatsapp-pairing.internal-sessions.v2` entry beside this one.
  - id: http.telegram-pairing.internal-sessions.v1
    kind: http-route
    value: /internal/telegram/sessions
    role: provider
    files:
      - connectors/telegram/src/pairing/app.ts
      - mcp-server/src/api/telegram-pairing-client.ts
    status: active
    note: >-
      Internal API of the telegram-pairing Deployment (telegram-connector image,
      :3002, in-cluster only; SC-1197 P4b), consumed by social-api. The Telegram
      twin of http.whatsapp-pairing.internal-sessions.v1: same HMAC scheme
      (headers x-connector-timestamp + x-connector-signature = sha256=HMAC(secret,
      "<ts>:<JSON body>"), 5-minute window), and because the HMAC covers the
      BODY only, four routes, all POST so the sessionKey travels inside the
      signed body: /start, /state and /me under this base, each with body
      {"sessionKey": "<sub>"}, plus /password with {"sessionKey": "<sub>",
      "password": "<2FA>"}. /start, /state and /password answer 200
      {sessionKey, state, qr, me} with state one of
      starting|qr|password|paired|expired|unpaired — `password` is the 2FA step
      of the mtcute QR flow, completed through /password, which answers the
      post-submit state; qr null or {value, dataUrl, issuedAt, expiresAt},
      me null or {id, username} (Telegram identity, not baileys' {id, jid,
      phone, name}). /me answers 200 {sessionKey, me} or 404
      {"error":"not_paired"}. Errors: 400 {"error":"invalid_session_key"}; 400
      {"error":"invalid_password"} (empty, non-string or over-long password);
      409 {"error":"password_not_requested"} (the flow is not waiting for a
      password); 401 bad or missing signature; 429 {"error":"rate_limited",
      reason: start_interval|daily_starts|pool_full|qr_limit,
      retryAfterSeconds} with a Retry-After header; 503
      {"error":"pairing_unavailable"} when the credential store is off, the
      master key is missing or no shared secret is set; 404
      {"error":"not_found"} for everything but GET /health while
      SOCIAL_PAIRING_API is off. The process reads exactly PORT,
      SOCIAL_PAIRING_API, SESSION_PATH, CONNECTOR_SHARED_SECRET, DB_USER,
      DB_PASSWORD, CREDENTIAL_STORE_MASTER_KEY, DATABASE_URL, TELEGRAM_API_ID
      and TELEGRAM_API_HASH — never the house accounts' TELEGRAM_SESSION_STRING*
      (pinned by app.test.ts). The base path, the methods, the body fields, the
      state names (including `password`), the error codes and the 429 reasons
      are all contract: renaming any of them, or moving the sessionKey out of
      the signed body, is breaking — a new `.v2` entry beside this one.
  - id: http.whatsapp-connector.auth-qr
    kind: http-route
    value: /auth/qr
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      GET /api/v1/auth/qr of the house WhatsApp connectors (personal, professional,
      leila): unauthenticated, 200 {qrCode, expiresAt} (qrCode a PNG data URL,
      expiresAt ISO) or 404 {"error":"No QR code available"}. Registered by SC-1197
      (design D6) without changing its code so the per-sub pairing work cannot
      touch it: per-sub QR lives only on http.whatsapp-pairing.internal-sessions.v1.
      Path, method, the absence of auth and the response shape are contract;
      changing any of them is breaking — a new `.v2` entry beside this one.
  - id: http.social-api.pairing-whatsapp.v1
    kind: http-route
    value: /pairing/whatsapp
    role: provider
    files:
      - mcp-server/src/api/routes/pairing-whatsapp-start.ts
      - mcp-server/src/api/routes/pairing-whatsapp.ts
    status: active
    note: >-
      WhatsApp pairing surface of the social-api Deployment (mcp-server image,
      :3020, in-cluster only — ns messages / app dgx-messages via the
      whatsapp-mcp-allow-messages-social-api netpol; no IngressRoute). Two
      routes, both behind the Keycloak JWT verifier
      (http.social-api.jwt-audience.v1) and the hardening guards:
      POST /pairing/whatsapp/start begins a pairing for the caller,
      GET /pairing/whatsapp polls it (QR by polling, not SSE). No parameters
      carry identity: the sessionKey sent to the pool is always the JWT `sub`;
      a `sub`, `sessionKey` or `jid` in the query or body with a different
      value is 403 {"error":"forbidden_identity"}, a present Origin outside
      SOCIAL_API_ALLOWED_ORIGINS (empty default) is 403
      {"error":"forbidden_origin"}, no CORS headers are ever answered. 200 is
      the pool's PairingStatus verbatim: {sessionKey, state, qr, me} with
      state starting|qr|paired|expired|unpaired, qr null or {value, dataUrl,
      issuedAt, expiresAt}, me null or {id, jid, phone, name}. Errors: 401
      {"error":"unauthorized"} with WWW-Authenticate: Bearer; 429 passed
      through from the pool {"error":"rate_limited", reason,
      retryAfterSeconds} with Retry-After; 503 {"error":"identity_unavailable"}
      (JWKS unreachable) or {"error":"pairing_unavailable"} (store off, no
      HMAC secret, pool down); 404 {"error":"not_found"} while
      SOCIAL_PAIRING_API is off or on unknown paths; 400
      {"error":"invalid_json"} on a malformed body. Paths, methods, the
      PairingStatus shape, these error codes and the 401/403/503 gates are
      contract: changing any is breaking — a new `.v2` entry beside this one.
  - id: http.social-api.me-whatsapp.v1
    kind: http-route
    value: /me/whatsapp
    role: provider
    files:
      - mcp-server/src/api/routes/me-whatsapp.ts
    status: active
    note: >-
      GET /me/whatsapp of social-api: the caller's own paired WhatsApp, keyed
      by the JWT `sub` through the pool — a token of A can never return B's
      jid and nothing is ever listed. Same JWT + Origin + identity + store
      gates and the same 401/403/503/404-off error set as
      http.social-api.pairing-whatsapp.v1. 200 {"jid": "<device-less user
      jid>"} or 404 {"error":"not_paired"}. Path, method, the {jid} shape and
      not_paired are contract; the older HMAC'd /api/v1/me of the house
      connectors (controller.ts) is a DIFFERENT, untouched surface (design
      D6). Changing any of this is breaking — a new `.v2` entry beside this
      one.
  - id: http.social-api.pairing-telegram.v1
    kind: http-route
    value: /pairing/telegram
    role: provider
    files:
      - mcp-server/src/api/routes/pairing-telegram-start.ts
      - mcp-server/src/api/routes/pairing-telegram.ts
      - mcp-server/src/api/routes/pairing-telegram-password.ts
    status: active
    note: >-
      Telegram pairing surface of the social-api Deployment (SC-1197 P4b): the
      Telegram twin of http.social-api.pairing-whatsapp.v1, same gates and same
      error set (Keycloak JWT http.social-api.jwt-audience.v1, Origin,
      identity, store), but its OWN pool: the store gate and the pool client
      are per-route (RouteSpec.pool) — a missing TELEGRAM_PAIRING_URL 503s
      these routes only, never the whatsapp ones. Three routes:
      POST /pairing/telegram/start begins a per-sub mtcute QR pairing on the
      telegram-pairing pool, GET /pairing/telegram polls it (QR by polling,
      not SSE), POST /pairing/telegram/password completes the 2FA step with
      body {password}. No parameters carry identity: the sessionKey sent to
      the pool is always the JWT `sub`; a foreign `sub`/`sessionKey` in query
      or body is 403 {"error":"forbidden_identity"}. 200 is the pool's
      TelegramPairingStatus verbatim: {sessionKey, state, qr, me} with state
      starting|qr|password|paired|expired|unpaired, qr null or {value,
      dataUrl, issuedAt, expiresAt}, me null or {id, username}. Errors beyond
      the shared set: 400 {"error":"invalid_password"} (missing, empty or
      over-long body.password), 409 {"error":"password_not_requested"} passed
      through from the pool when /password is called outside the `password`
      state, 429 {"error":"rate_limited", reason, retryAfterSeconds} with
      Retry-After. Paths, methods, the TelegramPairingStatus shape, the
      `password` state and step, these error codes and the per-pool gate
      independence are contract: changing any is breaking — a new `.v2` entry
      beside this one.
  - id: http.social-api.me-telegram.v1
    kind: http-route
    value: /me/telegram
    role: provider
    files:
      - mcp-server/src/api/routes/me-telegram.ts
    status: active
    note: >-
      GET /me/telegram of social-api (SC-1197 P4b): the caller's own paired
      Telegram, keyed by the JWT `sub` through the telegram-pairing pool — a
      token of A can never return B's identity and nothing is ever listed.
      Same JWT + Origin + identity gates and the same 401/403/503/404-off
      error set as http.social-api.pairing-telegram.v1, gated on the TELEGRAM
      pool (a missing TELEGRAM_PAIRING_URL 503s this route only). After a pool
      restart the answer comes from the credential-store row without the user
      re-authorizing (the pool's lazy load). 200 {"id": "<telegram user id>",
      "username": "<username or null>"} or 404 {"error":"not_paired"}. Path,
      method, the {id, username} shape and not_paired are contract; the older
      HMAC'd /api/v1/me of the house telegram connector is a DIFFERENT,
      untouched surface. Changing any of this is breaking — a new `.v2` entry
      beside this one.
  - id: http.social-api.social-status.v1
    kind: http-route
    value: /social/status
    role: provider
    files:
      - mcp-server/src/api/routes/social-status.ts
    status: active
    note: >-
      GET /social/status of social-api (SC-1197 P2, design D3): the CALLER's
      own channel states, keyed by the JWT `sub` — nothing is ever listed or
      enumerated and the body carries no identifiers (no jid, no username, no
      sessionKey), so a token of A can never leak anything of B. Behind the
      same JWT + Origin + identity gates as http.social-api.pairing-whatsapp.v1
      (401 without a token with WWW-Authenticate: Bearer, 403 for a foreign
      Origin or a `sub`/`sessionKey`/`jid` in the query or body that is not
      the caller's, 503 {"error":"identity_unavailable"} when the JWKS is
      unreachable (same as http.social-api.pairing-whatsapp.v1), 404
      {"error":"not_found"} while SOCIAL_PAIRING_API is off). 200 is
      {channels: {whatsapp: {state}, telegram: {state},
      instagram: {state}}, houseAccounts: [{channel, accountId, label}]}
      where state is one of paired|expired|unpaired|unavailable: whatsapp
      from the pool's state route (row → paired, provider-invalidated during
      the process's life → expired, no row → unpaired, pool down, pool not
      configured, store off, or any non-200 answer from the pool (429/4xx/5xx)
      → unavailable; a pairing in flight — starting/qr — is unpaired, the row
      is written only after the first connection open), telegram from the
      telegram-pairing pool's state route with the same reading (SC-1197 P4b;
      its extra `password` state — the 2FA step of the QR flow, still in
      flight — is likewise unpaired, and a pool not configured is
      unavailable, never a fake unpaired), instagram is
      store.get(sub): row → paired, row with expiresAt in the past → expired,
      no row → unpaired, store off or unreadable row → unavailable.
      houseAccounts is the read-only intersection of the caller's identity
      binding with the account registry (design D4; an unreadable bindings
      table binds nobody → []). Unlike /pairing/* and /me/*, this route
      answers 200 with `unavailable` states while the store is OFF — it is
      the one route that skips the 503 pairing_unavailable store gate
      (design D7).
      The path, the method, the response shape, the four state values
      (including `unavailable`, which SC-1198 consumes) and the store-off
      deviation are contract: changing any is breaking — a new `.v2` entry
      beside this one.
  - id: http.social-api.jwt-audience.v1
    kind: allowlist
    value: social-api
    role: provider
    files:
      - mcp-server/src/api/auth/keycloak-jwt.ts
    status: active
    note: >-
      The token identity contract of social-api (design D2): every request to
      /pairing/* and /me/* must carry Authorization: Bearer <JWT> verified
      against SOCIAL_API_JWKS_URL (default in-cluster Keycloak realm edani),
      iss = SOCIAL_API_JWT_ISSUER
      (https://auth-next.e-dani.com/realms/edani), RS256 only, clockTolerance
      30 s — the JOSE `typ` header is NOT checked (the live edani realm emits
      typ=JWT: Keycloak 26.6.2 default, measured 2026-09-25; pinning
      typ=Bearer would 401 every real token — architect verdict on PR #79),
      `aud` CONTAINING this value ("social-api" — needs
      the Audience mapper on the dgx-messages client, SC-1198 historia 0),
      and `azp` in SOCIAL_API_ALLOWED_AZP (default dgx-messages). The `sub`
      claim is the sessionKey of every pairing operation; no header-carried
      identity is ever read (x-user-sub is not an input — SC-1144). A bad
      token is 401 with WWW-Authenticate: Bearer; an unreachable JWKS is 503
      (fail closed). The audience string, the issuer, the algorithm set and
      the "never read x-user-sub" rule are contract: a second audience is a
      new value, retiring or renaming this one is breaking — a new `.v2`
      entry beside this one.
