  - id: http.whatsapp-connector.privacy-update.v1
    kind: http-route
    value: /privacy
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/privacy of the house WhatsApp connectors (fase 3 / PR-8),
      consumed by dgx-messages (privacy panel, edit with confirmation). It
      changes the ACCOUNT for every contact. HMAC-signed body {setting, value,
      confirm: true, actor?}: one setting per call, Baileys' exact values —
      lastSeen / profilePicture / status: all | contacts | contact_blacklist |
      none; online: all | match_last_seen; readReceipts: all | none;
      groupsAdd: all | contacts | contact_blacklist; call: all | known;
      messages: all | contacts; defaultDisappearing (new chats' timer): 0 |
      86400 | 604800 | 7776000 — anything else 400 invalid_request; without
      confirm === true 400 invalid_request code confirm_required. Then 403
      disabled_sending (same gate as every send), 503 disconnected. The
      current value is read first and an equal one is not sent. Answers 200
      {updated: true, setting, value, previous, changed, privacy (the
      privacy-read.v1 view after the change, null if the read-back failed)}.
      Errors {error, failureClass, code?}: also 422 rejected_by_whatsapp
      (code = WhatsApp's). Nothing stored, no NATS event. The path, the body
      fields, the 200 shape and the failureClass values are contract:
      changing any is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_set_privacy (mcp-server/src/mcp/server.ts canonicalSetPrivacy: one setting per call, confirm: true forced by the tool schema; added later, surface unchanged).
  - id: http.whatsapp-connector.chats-disappearing-read.v1
