  - id: http.whatsapp-connector.chats-start.v1
    kind: http-route
    value: /chats/start
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/chats/start of the house WhatsApp connectors (fase 3 /
      PR-9), consumed by dgx-messages ("Nuevo chat"). HMAC-signed body {phone,
      message?, actor?}: phone E.164 (or 9 digits of WA_DEFAULT_COUNTRY_CODE),
      message ≤ 4096 characters — else 400 invalid_request. Then 403
      disabled_sending (same gate as every send, also without a message: it
      asks WhatsApp about a number), 503 disconnected. Resolves to the
      conversation this account ALREADY has (the phone jid, or its LID through
      social_contact_aliases, merged tombstones followed) without asking
      WhatsApp; otherwise onWhatsApp (not on WhatsApp → 422 not_on_whatsapp)
      and WhatsApp's LID for the number, looked up again. Never creates a PN
      twin: only when nothing exists (and only with ingest) one conversations
      row is inserted, under the LID when known with the phone jid in
      wa_chat_id (008's trigger records the alias), else under `digits@c.us`.
      Answers 200 {started: true, chat: {conversationId (namespaced, null when
      not persisted), chatId (bare jid sends address), phone, lid, name,
      created, existing, persisted}, message?: {sent, messageId, sentAt}}. The
      optional first message goes through /messages/send's path to chatId,
      opt-in Idempotency-Key (hash over phone + message; replay adds
      deduplicated: true). If only the message fails: the send failure status
      with {error, failureClass, started: true, chat, message: {sent: false},
      fallback? (account_restricted: manual wa.me URL)}. The path, the body
      fields, the 200 shape and the failureClass values are contract: changing
      any is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_start_chat (mcp-server/src/mcp/server.ts canonicalStartChat; added later, surface unchanged).
  - id: http.whatsapp-connector.messages-sticker.v1
    kind: http-route
