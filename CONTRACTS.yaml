    status: active
    note: >-
      POST /api/v1/contacts/block of the house WhatsApp connectors, consumed by
      dgx-messages ("Bloquear / Desbloquear"). HMAC-signed body {phone |
      conversationId (exactly one; a group is refused), action: block|unblock,
