  - id: http.whatsapp-connector.chats-presence.v1
    kind: http-route
    value: /chats/presence
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/chats/presence of the house WhatsApp connectors (fase 3 /
      PR-8), consumed by dgx-messages (/messages → "escribiendo…" while an
      operator types in the WhatsApp composer). HMAC-signed body
      {conversationId?, state, actor?}: state composing | recording | paused
      needs the chat (a group, `…@c.us` / `…@s.whatsapp.net` or `…@lid`, bare or
      account-namespaced; a merged conversation acts on its canonical jid; a
      chat unknown to this account is 404 conversation_unavailable) and goes as
      a chat-state to that chat only — the account's availability does not
      change; state unavailable | available is account-wide and refuses a
      conversationId (400). The connector NEVER sends available on its own
      (markOnlineOnConnect false): online on a linked device silences the
      phone's push notifications, so an explicit available is 403
      presence_available_disabled unless the deployment sets
      WA_PRESENCE_ALLOW_AVAILABLE=true (default off). Order: 400
      invalid_request → 403 disabled_sending (same gate as every send) → 403
      presence_available_disabled → 503 disconnected. The same state to the
      same chat within 3 s is not re-sent (sent false, throttled true). Answers
      200 {ok: true, state, scope: chat|account, chatId, conversationId, sent,
      throttled}. Errors {error, failureClass, code?}: also 422
      rejected_by_whatsapp | presence_unsupported (no push name), other send
      failure classes as /messages/send. Nothing stored, no NATS event. The
      path, the body fields, the 200 shape and the failureClass values are
      contract: changing any is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_send_typing (mcp-server/src/mcp/server.ts canonicalSendTyping: composing | recording | paused in one chat only, never unavailable / available; added later, surface unchanged).
  - id: http.whatsapp-connector.chats-presence-read.v1
    kind: http-route
    value: /chats/presence/read
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/chats/presence/read of the house WhatsApp connectors (fase
      3 / PR-8), consumed by dgx-messages (/messages → contact presence in the
      chat header). HMAC-signed body {conversationId, participant?}
      (participant: phone or user jid, for one member of a group). A read: no
      sending gate; 503 disconnected. Presence lives in the connector's memory
      only (from WhatsApp's presence.update; 60 s for online / offline, 8 s
      for typing / recording; cleared on every reconnect) and is looked up
      under the chat's PN and LID ids. Answers 200 {presence: {chatId,
      conversationId, isGroup, presence: {participantId, status: available |
      unavailable | composing | recording | unknown, lastSeen (ISO | null),
      observedAt (ISO | null)}, participants (groups: each fresh member, typing
      first), refreshing}}. Nothing fresh → status unknown (never a stale
      online) and the chat is re-subscribed at most every 30 s (refreshing
      true: ask again shortly; subscribing reveals nothing about us). Errors
      {error, failureClass}: 400 invalid_request, 404, 503. The path, the body
      fields, the 200 shape and the status values are contract: changing any
      is breaking — a new `.v2` entry beside this one.
      Also consumed by the MCP tool social_get_presence (mcp-server/src/mcp/server.ts canonicalGetPresence; added later, surface unchanged).
