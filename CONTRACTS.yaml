      conversation_unavailable). Then 403 disabled_sending (same gate as every
      send), 503 disconnected. A group: fresh metadata — 403 not_group_member,
      403 not_group_admin when the group restricts its settings and we are not
      admin, 422 community_unsupported — then groupToggleEphemeral (members
      see the system notice). A direct chat: the timer message WhatsApp's own
      clients send (the contact sees it). A known equal timer is not re-sent
      (changed false). Answers 200 {updated: true, chatId, conversationId,
      isGroup, expiration, label, previous (null = unknown), changed,
      persisted}. DB effect (ingest only, migration 014): the timer on the
      canonical conversation with ephemeral_setting_at = now; inbound changes
      (either side, chats.update) and snapshots land there too, never over a
