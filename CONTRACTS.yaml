    status: active
    note: >-
      POST /api/v1/messages/pins of the house WhatsApp connectors: the active
      pinned messages of one chat, consumed by the MCP tool social_list_pinned
      (mcp-server/src/mcp/server.ts canonicalListPinned). A read: not gated,
      answers while disconnected. HMAC-signed body {conversationId} (bare or
      account-prefixed; resolved to its canonical conversation); missing →
      400 invalid_request. From whatsapp_message_pins joined to messages: not
      expired, message not revoked, newest pin first, at most 3 (what WhatsApp
      shows). 200 {conversationId (canonical, bare), pinned [{messageId,
      conversationId, chatName, senderId, direction, messageType, content,
      sentAt, isDeleted, pinnedAt, expiresAt, durationSeconds, pinnedBy,
      source}], limit: 3, persisted}; persisted false + [] while ingest is off
      or migration 018 is missing. Only pins seen since 018 (no backfill). The
      path, the body fields and the 200 shape are contract: changing any is
      breaking — a new `.v2` entry beside this one.
  - id: http.whatsapp-connector.communities-list.v1
