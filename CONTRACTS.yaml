# CONTRACTS.yaml — contract surface of k8s-socialmedia-pocharlies.
#
# This repo PUBLISHES HTTP routes that other processes call (social-api →
# whatsapp-pairing, the house QR flow → the whatsapp connector). Those names
# and shapes are contract: a rename or a shape edit breaks a consumer this
# repo's own tests cannot see. Created by SC-1225 (SC-1197 P1a, design D6);
# later parts of SC-1197 (P1b social-api, P2 status, P4b telegram) add their
# entries in the same push as the surface.
#
# The MCP tool contract keeps generating outside the registry
# (contracts/socialmedia-tools.*, checked by `pnpm contract:check`); its
# surface is registered as mcp.socialmedia-tools.v2.
#
# Enforced by the generic checker — k8s-gitops-pocharlies/scripts/check-contracts.py
# — from the global pre-push hook and as a CI backstop.
#
# Lo existente NO muta. Breaking = entrada nueva `.vN+1`, la vieja a
# `status: deprecated` con `replaced_by` + `remove_after`. Las entradas nunca se
# borran (retirar = `status: removed`). Un commit que toca superficie de contrato
# actualiza el registry en el mismo push y lleva el trailer
# `Contract-Change: <accion> <id>`.
#
# Reglas completas y via de excepcion: skill `synapse-contracts`.
version: 1
canonical_checkout: /home/dibanez/k8s/k8s-socialmedia-pocharlies
registry_files:
  - CONTRACTS.yaml
contracts:
  - id: http.whatsapp-pairing.internal-sessions.v1
    kind: http-route
    value: /internal/whatsapp/sessions
    role: provider
    files:
      - connectors/whatsapp-web/src/pairing/app.ts
      - mcp-server/src/api/whatsapp-pairing-client.ts
    status: active
    note: >-
      Internal API of the whatsapp-pairing Deployment (whatsapp-connector image,
      :3001, in-cluster only), consumed by social-api (SC-1197 P1b). Three routes,
      all POST so the sessionKey travels inside the HMAC-signed body
      (connectors/whatsapp-web/src/api/auth.ts createHMACAuth: headers
      x-connector-timestamp + x-connector-signature = sha256=HMAC(secret,
      "<ts>:<JSON body>"), 5-minute window): /start, /state and /me under this
      base, each with body {"sessionKey": "<sub>"}. /start and /state answer 200
      {sessionKey, state, qr, me} with state one of starting|qr|paired|expired|unpaired,
      qr null or {value, dataUrl, issuedAt, expiresAt}, me null or {id, jid, phone,
      name}; /me answers 200 {sessionKey, me} or 404 {"error":"not_paired"}. Errors:
      400 {"error":"invalid_session_key"}; 401 bad or missing signature; 429
      {"error":"rate_limited", reason: start_interval|daily_starts|pool_full|qr_limit,
      retryAfterSeconds} with a Retry-After header; 503 {"error":"pairing_unavailable"}
      when the credential store is off, the master key is missing or no shared secret
      is set; 404 {"error":"not_found"} for everything but GET /health while
      SOCIAL_PAIRING_API is off. The base path, the methods, the body field, the state
      names, the error codes and the 429 reasons are all contract: renaming any of
      them, or moving the sessionKey out of the signed body, is breaking — a new
      `http.whatsapp-pairing.internal-sessions.v2` entry beside this one.
      SC-1229 round 2 (migrate, surface unchanged): social-api's consumer-side
      request choreography now lives in the shared
      mcp-server/src/api/pairing-pool-client.ts (PairingPoolClient, 'whatsapp'
      channel); the consumer-side base-path constant stays in
      mcp-server/src/api/whatsapp-pairing-client.ts.
  - id: http.telegram-pairing.internal-sessions.v1
    kind: http-route
    value: /internal/telegram/sessions
    role: provider
    files:
      - connectors/telegram/src/pairing/app.ts
      - mcp-server/src/api/telegram-pairing-client.ts
    status: active
    note: >-
      Internal API of the telegram-pairing Deployment (telegram-connector image,
      :3002, in-cluster only; SC-1197 P4b), consumed by social-api. The Telegram
      twin of http.whatsapp-pairing.internal-sessions.v1: same HMAC scheme
      (headers x-connector-timestamp + x-connector-signature = sha256=HMAC(secret,
      "<ts>:<JSON body>"), 5-minute window), and because the HMAC covers the
      BODY only, four routes, all POST so the sessionKey travels inside the
      signed body: /start, /state and /me under this base, each with body
      {"sessionKey": "<sub>"}, plus /password with {"sessionKey": "<sub>",
      "password": "<2FA>"}. /start, /state and /password answer 200
      {sessionKey, state, qr, me} with state one of
      starting|qr|password|paired|expired|unpaired — `password` is the 2FA step
      of the mtcute QR flow, completed through /password, which answers the
      post-submit state; qr null or {value, dataUrl, issuedAt, expiresAt},
      me null or {id, username} (Telegram identity, not baileys' {id, jid,
      phone, name}). /me answers 200 {sessionKey, me} or 404
      {"error":"not_paired"}. Errors: 400 {"error":"invalid_session_key"}; 400
      {"error":"invalid_password"} (empty, non-string or over-long password);
      409 {"error":"password_not_requested"} (the flow is not waiting for a
      password); 401 bad or missing signature; 429 {"error":"rate_limited",
      reason: start_interval|daily_starts|pool_full|qr_limit,
      retryAfterSeconds} with a Retry-After header; 503
      {"error":"pairing_unavailable"} when the credential store is off, the
      master key is missing or no shared secret is set; 404
      {"error":"not_found"} for everything but GET /health while
      SOCIAL_PAIRING_API is off. The process reads exactly PORT,
      SOCIAL_PAIRING_API, SESSION_PATH, CONNECTOR_SHARED_SECRET, DB_USER,
      DB_PASSWORD, CREDENTIAL_STORE_MASTER_KEY, DATABASE_URL, TELEGRAM_API_ID
      and TELEGRAM_API_HASH — never the house accounts' TELEGRAM_SESSION_STRING*
      (pinned by app.test.ts). The base path, the methods, the body fields, the
      state names (including `password`), the error codes and the 429 reasons
      are all contract: renaming any of them, or moving the sessionKey out of
      the signed body, is breaking — a new `.v2` entry beside this one.
      SC-1229 round 2 (migrate, surface unchanged): the consumer-side request
      choreography is shared with the whatsapp twin in
      mcp-server/src/api/pairing-pool-client.ts (PairingPoolClient, 'telegram'
      channel; the consumer-side base-path constant stays in
      mcp-server/src/api/telegram-pairing-client.ts), and the pool's HMAC gate
      now verifies through shared's verifyHMACSignature — same scheme and same
      5-minute window as createHMACAuth, constant-time comparison.
  - id: http.whatsapp-connector.auth-qr
    kind: http-route
    value: /auth/qr
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      GET /api/v1/auth/qr of the house WhatsApp connectors (personal, professional,
      leila): unauthenticated, 200 {qrCode, expiresAt} (qrCode a PNG data URL,
      expiresAt ISO) or 404 {"error":"No QR code available"}. Registered by SC-1197
      (design D6) without changing its code so the per-sub pairing work cannot
      touch it: per-sub QR lives only on http.whatsapp-pairing.internal-sessions.v1.
      Path, method, the absence of auth and the response shape are contract;
      changing any of them is breaking — a new `.v2` entry beside this one.
  - id: http.whatsapp-connector.messages-forward.v1
    kind: http-route
    value: /messages/forward
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/messages/forward of the house WhatsApp connectors, consumed by
      the MCP tool social_forward_message (mcp-server/src/mcp/server.ts
      handleForwardMessage). HMAC-signed (x-connector-timestamp +
      x-connector-signature, same scheme as every connector route), body
      {chatId, messageId, toChatId}: the source is found by messageId (bare or
      account-namespaced) in process memory or in whatsapp_message_payloads
      (migration 009); chatId only names it in errors. Answers 200
      {forwarded: true, messageId} (the id of the new message), 403 when
      ENABLE_SENDING is not true, 400 on a missing field, 404
      {error, failureClass: "message_unavailable"} when the original is not
      known, 500 {error} otherwise. Registered by fase 3 / PR-1, when forwarding
      started to work (before it always answered 500). The path, the body
      fields, the 200 shape and the 404 failureClass are contract: changing any
      is breaking — a new `.v2` entry beside this one. Fase 3 / PR-3 (additive):
      EMERGENCY_DISABLE_SENDING=true also answers the 403, like every send.
      Behavior note (regresion 01-10, additive): forwarding to a 1:1 chat goes
      through the same first-contact guard as every new direct send — a person
      who never interacted with the account (no INBOUND message on the
      canonical conversation, no tctoken record) and to whom no privacy token
      can be attached is 403 {error, failureClass: "account_restricted"}
      instead of the 500; /messages/media/send answers the same 403 for it.
      A known contact is never held back for a missing or expired tctoken.
  - id: http.whatsapp-connector.messages-edit.v1
    kind: http-route
    value: /messages/edit
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/messages/edit of the house WhatsApp connectors (fase 3 /
      PR-3), consumed by dgx-messages (/messages → Editar) and by the MCP tool
      social_edit_message (mcp-server/src/mcp/server.ts handleEditMessage;
      added later, surface unchanged). HMAC-signed (same
      scheme as every connector route), body {chatId, messageId, content,
      actor?} (`conversationId` accepted for chatId; messageId bare or
      account-namespaced; actor ≤ 200 chars, recorded, never auth). Edits one
      of OUR OWN TEXT messages: the key is rebuilt from memory,
      whatsapp_message_payloads, whatsapp_message_keys or the messages row
      (restart-proof); the chat comes from that key. Answers 200 {edited: true,
      messageId, editId, editedAt} (messageId = the bare edited message, editId
      = the id of the edit stanza). Errors {error, failureClass}: 403
      disabled_sending (ENABLE_SENDING not true or EMERGENCY_DISABLE_SENDING),
      400 invalid_request (missing or blank field), 503 disconnected, 404
      message_unavailable (unknown message), 422 not_own_message / not_editable
      (not ours, not text, already deleted) / rejected_by_whatsapp (WhatsApp's
      own limits — e.g. its time window — refused it; `code` carries the ack
      error), other send failure classes as /messages/send. DB effect (no
      migration): content = new text, is_edited = true, the replaced text
      appended to metadata.edit_history [{content, replaced_at, source,
      actor?}] and metadata.edited_at — nothing is lost; NATS MessageUpdated
      EDITED with newContent. The path, the body fields, the 200 shape and the
      failureClass values are contract: changing any is breaking — a new `.v2`
      entry beside this one.
  - id: http.whatsapp-connector.messages-delete.v1
    kind: http-route
    value: /messages/delete
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/messages/delete of the house WhatsApp connectors (fase 3 /
      PR-3), consumed by the MCP social_delete_message
      (mcp-server/src/mcp/server.ts handleDeleteMessage) and dgx-messages
      (/messages → Eliminar para todos / para mí). HMAC-signed, ids inside the
      signed body: {chatId, messageId, forMe?, actor?} (forMe a boolean,
      default false). forMe false = delete for everyone (revoke): our own
      messages, or anyone's in a group where WhatsApp lets us as admin (a
      contact's 1:1 message is 422 not_own_message); DB is_deleted = true,
      status = 'deleted', metadata.deleted_at, CONTENT KEPT; NATS MessageUpdated
      DELETED. forMe true = delete for me: WhatsApp app-state deleteForMe with
      the key and the original timestamp from the durable copies (media on the
      phone left alone); DB metadata.deleted_for_me = true (+ _at), is_deleted
      untouched; NOT published on NATS (a view flag of this account). Answers
      200 {deleted: true, scope: "everyone" | "me", messageId, deletedAt}.
      Errors {error, failureClass}: 403 disabled_sending, 400 invalid_request,
      503 disconnected, 404 message_unavailable (unknown message, or no
      timestamp for delete for me), 422 not_own_message / rejected_by_whatsapp
      (with `code`). The older DELETE /api/v1/messages/:chatId/:msgId stays as
      an alias of forMe false with the same gate and answers (its path ids are
      not covered by the HMAC — new callers use this route). The path, the
      body fields, the scope values, the 200 shape and the failureClass values
      are contract: changing any is breaking — a new `.v2` entry beside this
      one.
      The MCP social_delete_message also sends forMe: true when the caller asks for delete for me (handleDeleteMessage; added later, surface unchanged).
  - id: http.whatsapp-connector.send-idempotency.v1
    kind: http-route
    value: Idempotency-Key
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
      - connectors/whatsapp-web/src/send-idempotency.ts
    status: active
    note: >-
      Opt-in send idempotency on POST /api/v1/messages/send, /messages/media/send
      and /messages/audio of the house WhatsApp connectors (fase 3 / PR-2),
      consumed by the MCP social_send_message (mcp-server/src/mcp/server.ts sends
      one derived key per WhatsApp sub-operation). Only an explicit key turns it
      on: header `Idempotency-Key` and/or body field `idempotencyKey` (same value
      if both; a string of at most 200 characters, blank = absent; otherwise 400
      {error, failureClass: "invalid_request"}). NEVER keyed on sendToken, which
      callers reuse (synapse, dgx-messages, skirmshop-labels): without a key the
      three routes answer exactly what they answered before. With a key, scoped
      to (connector account, sha256(key)) for WA_SEND_ATTEMPT_RETENTION_DAYS (7)
      in whatsapp_send_attempts (migration 010): the same key with the same
      request answers the recorded outcome without sending again, plus
      `deduplicated: true` (text/audio {messageId, sentAt}; media {sent, sentAt,
      messageId} — media answers messageId only under a key); the same key with
      a different request is 409 {error, failureClass: "idempotency_key_reused"};
      an earlier attempt whose outcome is unknown (crash or timeout after the
      network send) is 409 {error, failureClass: "send_outcome_uncertain",
      messageId}. The WhatsApp message id is derived from (account, key)
      (`3EB0` + 18 hex). While the table is missing the key is ignored and the
      send goes out. The header/field names, the replay semantics, the two 409
      failureClass values and the no-key-is-legacy rule are contract: changing
      any is breaking — a new `.v2` entry beside this one.
  - id: http.whatsapp-connector.messages-react.v1
    kind: http-route
    value: /messages/react
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/messages/react of the house WhatsApp connectors, consumed by
      dgx-messages (dgx_messages/routes_messages.py react_message, /messages →
      reaction picker; also the older copy in dgx-infra's dashboard). Registered
      by fase 3 / PR-4 (the route predates the registry). HMAC-signed (same
      scheme as every connector route), body {conversationId, messageId, emoji}
      (`chatId` accepted for conversationId; messageId bare or
      account-namespaced; emoji a string, "" or null = remove our reaction).
