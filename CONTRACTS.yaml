      consumed by dgx-messages ("Bloqueados", the blocked badge). HMAC over
      "{}"; a read, ungated; 503 disconnected. One fetchBlocklist() (or the
      in-memory list of the socket when read < 60 s ago and patched by
      blocklist.update; fresh=1 forces the read), collapsed one entry per
      person: 200 {blocked: [{id (the LID when known), jids, blockedJids,
      phone (E.164 from a phone jid, never LID digits), name, pushName,
      conversationId (canonical 1:1, null when none)}], count, readAt,
