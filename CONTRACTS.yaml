      account's starred messages, consumed by the MCP tool social_list_starred
      (mcp-server/src/mcp/server.ts canonicalListStarred). A read: not gated,
      answers while disconnected. HMAC-signed body {conversationId?, limit?,
      cursor?}: conversationId filters one chat (resolved to its canonical
      conversation, tombstones and contact aliases followed); limit 1–200
      (default 50); cursor the opaque nextCursor of the previous page; else
      400 invalid_request. From whatsapp_message_stars joined to messages:
      newest star first, messages deleted for me left out. 200 {starred
      [{messageId, conversationId, chatName, senderId, direction, messageType,
      content, sentAt, isDeleted, starredAt, source (connector | whatsapp |
      history)}], nextCursor (null on the last page), persisted,
      conversationId? (with the filter)}; persisted false + [] while ingest is
      off or migration 018 is missing. Ids bare. The path, the body fields and
      the 200 shape are contract: changing any is breaking — a new `.v2`
      entry beside this one.
  - id: http.whatsapp-connector.messages-pin.v1
    kind: http-route
    value: /messages/pin
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/messages/pin of the house WhatsApp connectors: pin / unpin
      a message for everyone in its chat, consumed by the MCP tool
      social_pin_message (mcp-server/src/mcp/server.ts canonicalPinMessage).
      HMAC-signed body {conversationId?, messageId, pin, durationSeconds?,
      actor?}: pin a boolean; durationSeconds 86400 | 604800 | 2592000 (default
      604800) only for a pin. 400 invalid_request first, then the sending gate
      (403 disabled_sending), 503 disconnected and the opt-in Idempotency-Key
      (send-idempotency.v1: replay {messageId, sentAt, deduplicated}, 409
      idempotency_key_reused / send_outcome_uncertain). Key from the durable
      copies as messages-star.v1 (404 message_unavailable). In a group: fresh
      metadata, 403 not_group_member, and 403 not_group_admin when the group's
      info is admin-only (restrict) and we are not admin. Sends
      pinInChatMessage PIN_FOR_ALL / UNPIN_FOR_ALL (Baileys sendMessage {pin,
      type, time}); recorded in whatsapp_message_pins (migration 018, ingest
      only) at the time the pin message carries, so its echo changes nothing.
      200 {pinned, messageId (the pin / unpin message), pinnedMessageId,
      conversationId, pinnedAt?, expiresAt?, durationSeconds? (a pin),
      persisted, sentAt? (with a key)}. Inbound pins / unpins from anyone in
      the chat (and our phone) are recorded the same way (newer action wins,
      an unpin at the same time wins) and no longer write an empty
      MESSAGECONTEXTINFO / PININCHATMESSAGE messages row. The path, the body
      fields, the 200 shape and the failureClass values are contract:
      changing any is breaking — a new `.v2` entry beside this one.
  - id: http.whatsapp-connector.messages-pins.v1
    kind: http-route
    value: /messages/pins
    role: provider
    files:
