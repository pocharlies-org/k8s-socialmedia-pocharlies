      (missing or blank field, chatId neither a numeric id nor a username,
      non-numeric messageId, MESSAGE_EMPTY), 503
      disconnected, 404 message_unavailable (unknown message, chat or peer), 422
      not_own_message (not ours; MESSAGE_ID_INVALID / MESSAGE_AUTHOR_REQUIRED
