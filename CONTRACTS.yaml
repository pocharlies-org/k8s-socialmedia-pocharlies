      rejected_by_telegram (Telegram's own rules — e.g.
      MESSAGE_EDIT_TIME_EXPIRED, MESSAGE_TOO_LONG — in `code`), 429
      rate_limited (FLOOD_WAIT, retryAfterSeconds + Retry-After), 401 auth,
      504 timeout, 502 unknown. DB effect (no migration) through
      nats.telegram-connector.message-edited.v1, written by telegram-sync:
      content = new text, is_edited = true, the replaced text appended to
      metadata.edit_history [{content, replaced_at, source, actor?}] and
      metadata.edited_at — the WhatsApp representation. The path, the body
      fields, the 200 shape and the failureClass values are contract:
      changing any is breaking — a new `.v2` entry beside this one.
      mcp-server/src/mcp/server.ts (which carries this entry's marker) also
      hosts the local-index search of social_search_messages (Instagram rows
      and the mediaType filter, Postgres only — no connector route; added
      later, surface unchanged).
  - id: nats.telegram-connector.message-edited.v1
