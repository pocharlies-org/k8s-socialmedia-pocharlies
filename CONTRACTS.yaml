      / PR-9), consumed by dgx-messages (contacts panel). HMAC over "{}" (the
      query only filters a read; ungated). The people this account knows, one
      entry per person, read only from participants + live 1:1 conversations
      + social_contact_aliases (blocked ignored): PN (@c.us / @s.whatsapp.net)
      and LID of the same person collapse into one entry; our own jids are
      left out. q matches name / push name (ILIKE) or ≥ 3 digits of a jid;
      limit 1..500 (default 200; 0 or not an integer → 400 invalid_request).
      Newest activity first. Answers 200 {contacts: [{id (canonical jid, the
      LID when known), name (null when only a jid / number), pushName, phone
      (E.164 from a phone jid, never LID digits; null when unknown), jids,
      conversationId (live 1:1 conversations.id or null), lastActivityAt}],
      count}. A pairing-only client answers []. The path, the query and the
      200 shape are contract: changing any is breaking — a new `.v2` entry
      beside this one. POST /contacts is contacts-create.v1.
      Also consumed by the MCP tool social_list_contacts (mcp-server/src/mcp/server.ts canonicalListContacts; added later, surface unchanged).
  - id: http.whatsapp-connector.contacts-create.v1
    kind: http-route
    value: /contacts/create
    role: provider
    files:
      - connectors/whatsapp-web/src/api/controller.ts
    status: active
    note: >-
      POST /api/v1/contacts/create (alias POST /api/v1/contacts) of the house
      WhatsApp connectors (fase 3 / PR-9), consumed by dgx-messages ("Guardar
      contacto"). HMAC-signed body {phone, name (≤ 100), firstName?, actor?}
      — else 400 invalid_request. Then 403 disabled_sending, 503
      disconnected, onWhatsApp (not on WhatsApp → 422 not_on_whatsapp). Saves
      the contact with WhatsApp's own app-state mutation (Baileys
      addOrEditContact: contactAction {fullName, firstName, pnJid, lidJid?,
      saveOnPrimaryAddressbook: true}, index the phone jid — the same call
      /contacts/seed makes); a WhatsApp 4xx → 422 rejected_by_whatsapp.
      Answers 200 {created: true, contact: {phone, jid, lid, name,
      addressBookSync, persisted}}. DB effect (ingest only): the name on the
      person's EXISTING participant rows and live 1:1 conversation; no row is
      created. Whether the phone's address book shows it is WhatsApp's
      (saveOnPrimaryAddressbook is a request). The path, the body fields and
      the 200 shape are contract: changing any is breaking — a new `.v2`
      entry beside this one.
  - id: http.whatsapp-connector.contacts-share.v1
    kind: http-route
    value: /contacts/share
    role: provider
    files:
