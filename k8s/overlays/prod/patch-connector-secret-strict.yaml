# SKIRM-103 / SC-2092: CONNECTOR_SECRET_STRICT=true en mcp-sse y en los tres conectores
# de WhatsApp. Con el interruptor, requireConnectorSecret() (shared/src/crypto/connector-secret.ts)
# rechaza el valor por defecto del repositorio y el proceso no arranca.
#
# Solo se fusiona en la ventana de rotacion de CONNECTOR_SHARED_SECRET, con la clave propia ya
# en el Secret y comprobada por sha256. Un proceso estricto con el valor por defecto no arranca,
# y mcp-sse es Recreate con hostPort 3010: si no arranca, /social entero cae. Los conectores
# tienen que llevar ya su pin v1.3.109 (las tres PR de patch-image.yaml); con una imagen anterior
# la variable no se lee. Se pone aqui y nunca en base/: una variable nueva en la plantilla del pod
# reinicia los pods fuera de la ventana (SKIRM-88).
#
# Orden, un Deployment cada vez: mcp-sse, luego whatsapp-connector-leila,
# whatsapp-connector-professional y whatsapp-connector (personal) el ultimo. Un documento por
# Deployment, para dejar en la rama solo el del paso que toca antes de fusionar.
# Rollback = revert de este fichero y de su linea en `patches:`; el interruptor sale ANTES de
# volver al valor por defecto. Se retira cuando el estricto sea el valor por defecto (SC-2149).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sse
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: mcp-sse
          env:
            - { name: CONNECTOR_SECRET_STRICT, value: "true" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector-leila
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector-leila
          env:
            - { name: CONNECTOR_SECRET_STRICT, value: "true" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector-professional
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector-professional
          env:
            - { name: CONNECTOR_SECRET_STRICT, value: "true" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector
          env:
            - { name: CONNECTOR_SECRET_STRICT, value: "true" }
