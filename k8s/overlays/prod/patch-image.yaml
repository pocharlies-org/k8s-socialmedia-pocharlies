# SC-1197 encendido: since the `images:` block no longer carries
# whatsapp-connector / telegram-connector (it rewrites by image name and would
# have moved the HOUSE connectors together with the pairing pools), this file
# is the authority for those two names. The house digests below are
# byte-identical to what runs today (measured 25-09 in the live objects): the
# flip changes zero bytes for the house connectors. Every Deployment that uses
# either image name must appear here — an unpatched one would fall back to the
# base tag (`:latest` / the generator's pin).
