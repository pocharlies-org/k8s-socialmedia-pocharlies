# SC-1197 encendido: since the `images:` block no longer carries
# whatsapp-connector / telegram-connector (it rewrites by image name and would
# have moved the HOUSE connectors together with the pairing pools), this file
# is the authority for those two names. The house digests below are
# byte-identical to what runs today (measured 25-09 in the live objects): the
# flip changes zero bytes for the house connectors. Every Deployment that uses
# either image name must appear here — an unpatched one would fall back to the
# base tag (`:latest` / the generator's pin).
#
# INFRA-293 (P6 INFRA-112) 29-09: the three house whatsapp-connector* and the
# two house telegram-connector* advance socialmedia-v2-c88dce16 /
# socialmedia-v4-1c572645 -> v1.3.61 (run 36518430515, deploy/prod@a6a1547 —
# tip #101: backfill acotado al reconectar + reten/reenganche NATS). Both
# previous SHAs are ancestors of a6a1547 (git merge-base --is-ancestor), so the
# flip only adds code. Envs WA_RECONNECT_BACKFILL_* ride in via
# social-accounts.json (registry, PR #101).
#
# SC-1394 02-10: the three house whatsapp-connector* advance v1.3.87 -> v1.3.91
# (Release Production run 36959150256, deploy/prod@f43b1c6, which carries the
# merge 95ae878: whatsapp-pairing no revive un cliente cerrado por el pool —
# the reconnect loop after ~40 sockets/h without start). Digest resolved from
# Harbor (skopeo). whatsapp-pairing moves too — see its section below.
#
# QA 02-10: the three house whatsapp-connector* advance v1.3.91 -> v1.3.94
# (Release Production run 37039896599, deploy/prod@4fc6081, merge of #195):
# media we send is stored (upsert `append`), document fileName, reply quotes in
# metadata, no self-link in 1:1 chats, privacy-hidden avatar = 404. Digest
# resolved from Harbor (skopeo). whatsapp-pairing stays on v1.3.91.
#
# SKIRM-92 07-10: the three house whatsapp-connector* advance v1.3.99 -> v1.3.103
# (run 37680671534, deploy/prod@db096e9: #224 — el guard 1:1 cuenta el historial
# OUTBOUND). Digest checked against Harbor (crane). whatsapp-pairing stays on v1.3.91.
#
# SKIRM-101 08-10: the two house telegram-connector* advance v1.3.78 -> v1.3.105
# (run 37739696589, deploy/prod@129b8ea: #229 — recuperacion de medios de Telegram con
# tope de 8 intentos; el conector sirve GET /messages/single y un plazo de descarga).
# Digest checked against Harbor (crane). telegram-pairing stays on v1.3.57;
# whatsapp-connector* stay on v1.3.103.
#
# SKIRM-103 10-10: the three house whatsapp-connector* advance v1.3.103 -> v1.3.109 (run
# 38008072969, deploy/prod@3cdf251: F4a-F4d and the signed /api/public/* and /api/v1/history/*
# doors), one PR each: leila (#252), professional (#253) and this one, whatsapp-connector
# (personal), the last. No CONNECTOR_SECRET_STRICT here: the strict switch is a separate PR.
# SC-2760 20-10: los tres house whatsapp-connector* avanzan v1.3.109 -> v1.3.120 (run 39432368481):
# alias de rutas parametrizadas de la app whatsapp.e-dani.com (PR #282): fin del 501 en
# silenciar/archivar/fijar/leído, borrar para mí, desaparecientes y asunto de grupo.
# Digest checked against Harbor (docker manifest). whatsapp-pairing intacto.
#
# SC-3681 30-10: los tres house whatsapp-connector* avanzan v1.3.120 -> v1.3.133 (run 40988750820,
# deploy/prod@a1b2544): POST /groups/photo (foto de grupo, #406) y override decode-uri-component 0.5.1
# (CVE-2026-118664, #407). Digest comprobado en Harbor (API artifacts).
#
# INFRA-1008 30-10: los dos house telegram-connector* avanzan v1.3.130 -> v1.3.133 (mismo run
# 40988750820, deploy/prod@a1b2544, que ya trae la fusión 3afe07d del PR #405): getMessages pagina
# con iterHistory (before/after sobre /api/public/messages/:chatId, sin tope de 100 por llamada).
# Digest comprobado en Harbor (crane). telegram-pairing sigue en v1.3.57.
#
# SC-3681 30-10: los tres whatsapp-connector* avanzan v1.3.133 -> v1.3.134 (run 40997803810,
# deploy/prod@7f3fc60): el arranque del 133 murió con 42703 (el índice de chat fijaba
# message_timestamp_ms y la tabla de prod, forma fresca de la 015, solo tiene wa_timestamp) —
# CrashLoop de los tres hasta aquí. Fix #409. Digest comprobado en Harbor (API artifacts).
#
# SC-3681 30-10: RETROCESO de los tres a v1.3.120 (deploy/prod@917626b). El tronco del 133/134 trae el
# fail-closed de SC-2092 (createConnectorAccess rechaza CONNECTOR_SHARED_SECRET == placeholder), y el
# item de 1Password `whatsapp-mcp` sigue con el placeholder del repo: con el 134 toda la API del
# conector responde 401 (también los envíos del mcp-server). Con el 120, que no tiene ese gate, el
# HMAC con placeholder funciona como siempre. Avanzar de nuevo exige clave real en 1Password primero.
#
# DGX-1587 13-11: los tres house whatsapp-connector* avanzan a v1.3.151 (run 43479693004,
# deploy/prod@cfc0fa7, PR #493): un mensaje propio (fromMe upsert) pone el badge de no-leídos
# a 0 en store y BD — WhatsApp no sincroniza el leído al móvil y el «1 sin leer» se quedaba
# clavado. professional venía de skirm-376-d515faa (d515faa, ya en el tronco). Digest
# comprobado en Harbor (crane): v1.3.151 == sha-cfc0fa78934d. whatsapp-pairing intacto.
# DGX-1495 07-11 a 08-11: whatsapp-connector (personal) avanza v1.3.120 -> v1.3.145 (deploy/prod@e1eca05,
# PRs #470/#472/#474): el conector pide al dispositivo primario las app-state keys que faltan (los
# desfijados/archivados del móvil perdidos por colecciones bloqueadas). El ask se reenvía con relayMessage
# + category=peer (en rc13 sendMessage rechaza el contenido crudo, y el relay sin category cuelga
# enumerando el PN propio; es el shape que Baileys usa para sus propios mensajes de protocolo a meJid).
# Intermedios sha-8c5c786c74ef y v1.3.144: el envío seguía roto (y dos runs murieron firmando en Rekor 409).
# Digest comprobado en Harbor (API artifacts). El gate SC-2092 no bloquea: el Secret whatsapp-mcp-secrets
# lleva la clave real (64 chars, no el placeholder). Los otros dos whatsapp-connector* intactos (uno por
# PR, costumbre de la casa).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector
          image: harbor.e-dani.com/homelab/whatsappmcp-whatsapp-connector:v1.3.151@sha256:25cbb9e32a1c637390569a378069bece0c637420fa0f379c3f31ce836eb28935
