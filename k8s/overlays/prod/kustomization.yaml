apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: whatsapp-mcp
resources:
  - ../../base
patches:
  - path: patch-env.yaml
  - path: patch-image.yaml
  - path: patch-nodepool.yaml
  # SC-705 / SC-1214: per-user credential store. WhatsApp keeps the flag OFF
  # (house connectors set no CREDENTIAL_SESSION_KEY); the ON flip is
  # Instagram-only and lives in the second document of
  # patch-credential-store.yaml; rollback = revert of that document.
  # ON is prod-only, stg stays OFF.
  - path: patch-credential-store.yaml
  # SC-1197 encendido: SOCIAL_PAIRING_API=on + replicas 1 + CREDENTIAL_STORE_ENABLED
  # en social-api y los dos pools. Rollback = revert de este fichero y su linea.
  - path: patch-social-pairing-on.yaml
images:
  # The original Socialmedia v2 cutover remains pinned for unchanged services.
  # SC-1197 encendido: mcp-server advances v1.3.55 -> v1.3.57 (run
  # 36135670213, deploy/prod@115c066 — the tip that carries #70..#85: the P1a
  # baileys pairing pool, the P1b/P2/P4b social-api routes and the SC-1243
  # status fix). This block rewrites EVERY consumer of the image name, so the
  # advance also moves the house mcp-server, mcp-sse, the brain CronJobs
  # (brain-windows since INFRA-364) and the PreSync migrate Job — the repo's
  # established pin pattern (PRs
  # 73/76/78 did exactly this). All of them set DATABASE_URL, which the code
  # requires since SC-1239 C2 (#84), and migrate.ts's `_migrations` ledger
  # skips what 007/008 already applied.
  #
  # whatsapp-connector and telegram-connector are NO LONGER pinned here (were
  # socialmedia-v2-c88dce16 / socialmedia-v4-1c572645): the encendido needs
  # the two pairing pools on v1.3.57 while the HOUSE connectors keep their
  # current digests, and this block cannot tell them apart — it rewrites by
  # image name, house pods included. The per-deployment pins (house:
  # byte-identical digests to today, pools: v1.3.57) live in
  # patch-image.yaml, now the authority for those two names.
  # telegram-sync is SESSION-LESS (ingests via the connector NATS+HTTP API,
  # holds no Telethon session) and has no legacy DGX webhook path.
  - name: harbor.e-dani.com/homelab/whatsappmcp-telegram-sync
    newTag: v1.3.82
    digest: sha256:3fbf891f0fd28e7f962b4b4f5ab06522bb49f014702619914c397ab59e3618a1
  # SC-1214 C4 re-pin: v1.3.55 (run 36075936408, deploy/prod@7d6c030 — after
  # ee71b15, the SC-1143/P1 merge) carries the IG pairing flow + credential
  # resolution (resolveCredential) + the oauth callback route, still dark:
  # CREDENTIAL_STORE_ENABLED stays false until the pre-check (C6) PR.
  # SC-1256: v1.3.55 -> v1.3.74 (run 36725155383, deploy/prod@7f0dd82 — merge #123):
  # /health por sub del conector IG (puerta por actor de social_list_accounts) y,
  # de paso, SC-1258 #96 (tolerar 0 cuentas de env con CREDENTIAL_STORE_ENABLED).
  - name: harbor.e-dani.com/homelab/whatsappmcp-instagram-connector
    newTag: v1.3.74
    digest: sha256:b69814790dbdb288a5053bb9e11d9a23c20ba5cffc2e8ade71e35ded8df8aeb9
  # fase 3: v1.3.64 (run 36568095620) trajo las migraciones 009/010 (#95/#108);
  # v1.3.65 (run 36603533264, deploy/prod@c8cce97) añade PR-3 #110 (social_delete_message
  # por POST /messages/delete); v1.3.66 (run 36612247560, deploy/prod@c36993e) añade la
  # tool social_edit_message (#112); v1.3.67 (run 36623083265, deploy/prod@e015709) añade
  # la migración 011 (reacciones, #115) y editar en Telegram en el MCP (#114);
  # v1.3.68 (run 36642557180, deploy/prod@625b95d) añade la migración 012 (fijar/silenciar, #118).
  # v1.3.70 (run 36682303779, deploy/prod@57c825c) añade la migración 013 (votos de
  # encuestas y respuestas a eventos, #125) e imágenes sin pnpm (INFRA-285, #122).
  # v1.3.73 (run 36705379093, deploy/prod@fadad16) añade la migración 014 (temporizador de
  # mensajes temporales, #128). v1.3.71/v1.3.72 quemados por runs fallidos.
  # v1.3.74 (run 36725155383, deploy/prod@7f0dd82) añade SC-1256 (#123): social_list_accounts
  # por actor, omite Instagram sin credencial (no_credential). Sin migraciones nuevas.
  # v1.3.76 (run 36751988471, deploy/prod@2df6408) añade las 15 tools MCP de la fase 3 (#138)
  # y el Baileys parcheado (#139). Sin migraciones nuevas.
  # v1.3.78 (run 36792706654, deploy/prod@74ab0cb): migraciones 015 (backfills de reacciones
  # e is_deleted) y 017 (aviso de ediciones/borrados), tools social_block_contact /
  # social_list_blocked (#153) y los jobs de voz (INFRA-364, #154).
  # v1.3.79 (run 36796583315, deploy/prod@06ea1ea): migracion 016 (brain_windows y
  # messages.updated_at), jobs brain-windows (#157, CronJob suspendido) y el eco ASR de
  # Telegram desenvuelto (#159). Mismo bump para telegram-sync (#159).
  # v1.3.80 (run 36846209634, deploy/prod@19d2716): arregla el INSERT del ledger
  # brain_windows y el corte de sesiones enormes del backfill de ventanas (#164).
  # v1.3.82 (deploy/prod@ea5b8c4): textos bien formados (sin sustitutos UTF-16 sueltos)
  # antes del brain y del LLM (#168); incluye lo de v1.3.81 (#166).
  # v1.3.83 (run 36906114195, deploy/prod@84c9b76) añade la tool social_invite_to_group (#171);
  # mismo código que v1.3.82 en lo demás.
  - name: harbor.e-dani.com/homelab/whatsappmcp-mcp-server
    newTag: v1.3.83
    digest: sha256:8cd69ba00e5a040494caa3eafa0ee5917a494a0effad4cdbebeb1014e4a496ad
  - name: harbor.e-dani.com/homelab/whatsappmcp-whatsapp-synapse-bridge
    newTag: socialmedia-v2-c88dce16
    digest: sha256:21d7cf9b021dce06af53b779056f9bd5c599722251726e483cdb50917b02263e
