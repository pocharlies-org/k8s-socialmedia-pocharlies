# SC-705 phase 1.5 (SC-1144): per-user credential store patch for prod.
# Hard CTO condition: the flag may only ship ON in the SAME PR that implements
# envelope encryption of the payload (shared/src/session-store/payload-crypto.ts)
# AND against an image that carries both the store and the encryption.
#
# THIS PR keeps the flag OFF. The encryption ships here, but the live images
# are pre-store (mcp-server socialmedia-v3-f0f219bd, whatsapp-connector
# socialmedia-v2-c88dce16) and this repo builds registry images only from
# release.yml on a pushed git tag (reusable-ci builds without pushing), so no
# image carrying this code can exist before merge. Turning the flag ON is a
# PR2 that also re-pins whatsapp-connector (and mcp-server, whose PreSync
# migrate Job must carry migration 007) to the release built from the merged
# commit — same pattern as PR 51 (socialmedia-v4-1c572645).
#
# Master key: CREDENTIAL_STORE_MASTER_KEY (base64 of 32 bytes) travels inside
# the 1Password item `whatsapp-mcp`, which the ExternalSecret propagates whole
# (dataFrom.extract) into `whatsapp-mcp-secrets` → the connector's existing
# envFrom. No explicit secretKeyRef here on purpose: a missing field must not
# break pod startup; the store fails closed at put()/get() instead.
#
# Behaviour once PR2 turns it ON: the HOUSE connectors (personal/professional)
# do not set CREDENTIAL_SESSION_KEY, so they keep the exact legacy path
# (criterion 4, zero regression). The flag only takes effect for a per-sub
# connector deployment (Daniel's session, then Leila's), which sets
# CREDENTIAL_SESSION_KEY=<sub> and gets: encrypted load at start + saveCreds
# write-back. All other overlays (stg) stay OFF.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector
          env:
            # OFF in this PR by the CTO atomicity rule: ON rides PR2 together
            # with the image pin that carries the encrypted store.
            - { name: CREDENTIAL_STORE_ENABLED, value: "false" }
