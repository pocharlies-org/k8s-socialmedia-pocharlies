# SC-705 phase 1.5 (SC-1144): per-user credential store patch for prod.
# Hard CTO condition: the flag may only ship ON in the SAME PR that implements
# envelope encryption of the payload (shared/src/session-store/payload-crypto.ts)
# AND against an image that carries both the store and the encryption.
#
# THIS PR keeps the flag OFF. The encryption ships here, but the live images
# are pre-store (mcp-server socialmedia-v3-f0f219bd, whatsapp-connector
# socialmedia-v2-c88dce16) and this repo builds registry images only from
# release.yml on a pushed git tag (reusable-ci builds without pushing), so no
# image carrying this code can exist before merge. Turning the flag ON is a
# PR2 that also re-pins whatsapp-connector (and mcp-server, whose PreSync
# migrate Job must carry migration 007) to the release built from the merged
# commit — same pattern as PR 51 (socialmedia-v4-1c572645).
#
# Master key: CREDENTIAL_STORE_MASTER_KEY (base64 of 32 bytes) travels inside
# the 1Password item `whatsapp-mcp`, which the ExternalSecret propagates whole
# (dataFrom.extract) into `whatsapp-mcp-secrets` → the connector's existing
# envFrom. No explicit secretKeyRef here on purpose: a missing field must not
# break pod startup; the store fails closed at put()/get() instead.
#
# Behaviour once PR2 turns it ON: the HOUSE connectors (personal/professional)
# do not set CREDENTIAL_SESSION_KEY, so they keep the exact legacy path
# (criterion 4, zero regression). The flag only takes effect for a per-sub
# connector deployment (Daniel's session, then Leila's), which sets
# CREDENTIAL_SESSION_KEY=<sub> and gets: encrypted load at start + saveCreds
# write-back. All other overlays (stg) stay OFF.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector
          env:
            # OFF in this PR by the CTO atomicity rule: ON rides PR2 together
            # with the image pin that carries the encrypted store.
            - { name: CREDENTIAL_STORE_ENABLED, value: "false" }
---
# SC-1214 C8 (P2 de SC-1194) — SOLO-Instagram flip, per the VP pre-check (C6).
#
# Pre-check measured 25-09: user_channel_credentials did not exist before the
# PreSync Job of PR-1 (sc1214-pasada2b), so per-sub WhatsApp/Telegram rows for
# Daniel and Leila CANNOT exist yet -> the flip is Instagram-only. WhatsApp
# keeps its explicit false above; telegram/wa pairing pools and mcp-server/
# mcp-sse do not set the flag (absent = OFF). Nothing that works today is
# switched off: on the IG connector the flag gates ONLY the store and the
# pairing route (connectors/instagram/src/credential-resolution.ts,
# oauth-pairing.ts:118); requests without x-user-sub — webhook, jobs, the
# house accounts skirmshop/barbelpapis — keep the exact legacy env-token path.
# The store needs DATABASE_URL (set in the base manifest) and
# CREDENTIAL_STORE_MASTER_KEY (in whatsapp-mcp-secrets, 32 bytes, measured
# 23-09); with the flag ON and the table missing, every store call would
# error — hence the merge gate below.
#
# MERGE ONLY after PR-1 is merged AND the table is verified live after the
# Sync:
#   kubectl -n databases exec postgres-shared-3 -- psql -U postgres -d whatsappmcp \
#     -c "select tablename from pg_tables where tablename='user_channel_credentials'"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: instagram-connector
          env:
            # ON for the Instagram path only (SC-1214 C8); rollback = revert of
            # this document.
            - { name: CREDENTIAL_STORE_ENABLED, value: "true" }
---
# SC-1144 (SC-705 P1) — serving por sub para WhatsApp. Dos despliegues de
# servicio nombrados, uno por usuario humano, cada uno con la clave del almacén
# cifrado = su sub JWT de Keycloak (convención credential-session-key.ts:
# session_key = <sub>; el pool de pairing estampa SIEMPRE el sub del JWT en la
# fila, así que el valor del env y el del CM de bindings tienen que ser el mismo
# sub — nota-sre-p0-medicion (c) los midió vigentes). Con la fila ausente el
# conector WhatsApp queda arriba sirviendo el QR (sin CrashLoop): el emparejamiento
# es un gesto humano fuera de la historia (SC-1372).
#
# La clave maestra del store no se declara aquí: llega por el envFrom compartido
# `whatsapp-mcp-secrets` que el generador ya monta en todo conector (patrón
# SC-1197, cero ExternalSecrets nuevos).
#
# El de casa (`whatsapp-connector`, primer documento) NO se toca: sigue con el
# flag "false" explícito y sin session key = camino legacy exacto (decisión 2,
# cero regresión — criterio C5).
#
# Rollback = revert de estos dos documentos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector-leila
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector-leila
          env:
            # Leila (lays84.mv@gmail.com), sub JWT medido por el SRE 30-10 (HTTP 200).
            - { name: CREDENTIAL_STORE_ENABLED, value: "true" }
            - { name: CREDENTIAL_SESSION_KEY, value: "66ec6f4f-5f2c-44f6-a3db-0dccba6e1748" }
---
# SC-1145 (SC-705 P2) — serving por sub para Telegram. Un despliegue de
# servicio nombrado (telegram-connector-leila, contenedor `telegram-connector`),
# con el mismo sub JWT que su hermano de WhatsApp y el CM de bindings
# (decisión H5: el mismo sub en los tres sitios). La cuenta `telegram:daniel`
# de SC-1145 se retiró después: `daniel` es la misma cuenta que `personal`
# (paxanguero), así que su ranura solo duplicaba la sesión y la ingesta.
#
# H2 (trampa de adopción, nota-integrator-p0-serving-path 29089): con
# `sessionSecretKey: null` en el registro —obligado, la clave de Secret
# TELEGRAM_SESSION_STRING_LEILA no existe, y pedirla daría
# CreateContainerConfigError— el TELEGRAM_SESSION_STRING de la casa entra por el
# `envFrom` compartido `whatsapp-mcp-secrets`. `resolveCredential` del conector
# (connectors/telegram/src/credential-session.ts) hace ADOPT-ON-FIRST-USE con
# ese env: crearía la fila del sub con la sesión de casa y serviría la cuenta
# equivocada (viola la decisión 2). Por eso el parche FIJA
# `TELEGRAM_SESSION_STRING=""`: env manda sobre envFrom, el resolver ve el env
# vacío → sin fila y sin sesión → sin sesión.
#
# H3 (esperado, no defecto): sin fila emparejada en user_channel_credentials
# para ese sub, main.ts loguea "MTProto pairing gesture for this user is still
# pending" y sale con exit(1) → CrashLoopBackOff visible hasta el gesto de
# pairing (API SC-1197, fuera de los manifiestos — SC-1372). Con WhatsApp no
# pasa: allí sin fila el conector queda arriba sirviendo el QR.
#
# El bloque `deploy` del registro de Telegram no admite env extra (a diferencia
# del de WhatsApp): flag, session key y vaciado van sí o sí en este overlay.
# Cero ExternalSecrets nuevos: la clave maestra llega por el envFrom compartido
# (patrón SC-1197). Los de casa (telegram-connector / -professional) NO se
# tocan: siguen legacy por envFrom, cero regresión (C4).
#
# Rollback = revert de este documento.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-connector-leila
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: telegram-connector
          env:
            - { name: TELEGRAM_SESSION_STRING, value: "" }
            - { name: CREDENTIAL_STORE_ENABLED, value: "true" }
            - { name: CREDENTIAL_SESSION_KEY, value: "66ec6f4f-5f2c-44f6-a3db-0dccba6e1748" }
