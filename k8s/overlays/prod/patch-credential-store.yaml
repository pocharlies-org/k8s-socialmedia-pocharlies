# SC-705 phase 1.5 / PR2 (SC-1144): per-user credential store — prod ignition.
# Hard CTO condition (met here): the flag ships ON only in the same change
# that re-pins the images to a release carrying BOTH the store and envelope
# encryption. That release is socialmedia-v5-f0420fa0 (built from the merge
# of PR 52), and this PR also returns the PreSync migrate Job
# (whatsapp-mcp-migrate, k8s/base/manifest.yaml) that applies migration 007
# (user_channel_credentials) against the _migrations ledger.
#
# Master key: CREDENTIAL_STORE_MASTER_KEY (base64 of 32 bytes) travels inside
# the 1Password item `whatsapp-mcp`, which the ExternalSecret propagates whole
# (dataFrom.extract) into `whatsapp-mcp-secrets` → the connector's existing
# envFrom. No explicit secretKeyRef here on purpose: a missing field must not
# break pod startup; the store fails closed at put()/get() instead. OPERATOR
# GESTURE still owed before the FIRST per-sub connector is deployed: the item
# lacks the field today (checked 21-09 against whatsapp-mcp-secrets).
#
# Behaviour with the flag ON: no deployment currently sets
# CREDENTIAL_SESSION_KEY (house connectors personal/professional, leila), so
# every live connector keeps the exact legacy path (criterion 4, zero
# regression). The flag arms the code path for the per-sub connectors that
# phase 2 adds (Daniel's session, then Leila's): encrypted load at start +
# saveCreds write-back. All other overlays (stg) stay OFF.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      containers:
        - name: whatsapp-connector
          env:
            # ON in PR2, atomically with the socialmedia-v5-f0420fa0 image pin
            # and the PreSync migrate Job (CTO atomicity rule from phase 1.5).
            - { name: CREDENTIAL_STORE_ENABLED, value: "true" }
