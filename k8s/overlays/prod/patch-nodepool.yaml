# Node placement split (2026-06-02):
#
# Move only IP-AGNOSTIC workloads off the `ubuntu` node onto the ks5 NVMe pool, so ubuntu
# can shrink toward a residential-only worker.
#
# STILL on ubuntu's residential IP (NOT moved):
#  - whatsapp-connector{,-professional} + whatsapp-open-worker-professional: Baileys/WhatsApp
#    Web — WhatsApp flags datacenter IPs. They also carry Longhorn RWO session/profile PVCs,
#    and the Longhorn CSI DaemonSet does NOT tolerate dedicated=llm:NoSchedule → no CSI driver
#    on the arm64 GPU nodes → those PVCs can't attach there. Moving these needs (a) a
#    dedicated=llm toleration on the Longhorn CSI/engine DaemonSets and (b) a WIP-free arm64
#    image rebuild (the whatsapp-web source has active uncommitted work as of 2026-06-04).
#
# telegram-connector{,-professional,-leila}: on sauvage since INFRA-1103 (03-11), rendered by
#  scripts/render-connectors.py (connectorNodeSelector / connectorTolerations), not patched here.
#  gramjs, PVC-free, session in the Vault-synced secret whatsapp-mcp-secrets
#  (TELEGRAM_SESSION_STRING[_<ID>]) → recreating the pod reuses the same session. Recreate releases
#  the authkey before the new pod connects, so two IPs never hold it at once (the telethon
#  AuthKeyDuplicatedError of the earlier ks5 attempt was that cross-IP overlap, not the IP itself).
# MOVED 2026-06-04 to sauvage (edge node, role=edge:NoSchedule → toleration):
#  - telegram-sync{,-professional}: SESSION-LESS since v1.3.38 (ingests via NATS + the connector
#    HTTP API, holds no Telethon session) → no IP binding → safe on the OVH edge node (amd64).
#    That placement is now the renderer default for every telegram-sync (syncNodeSelector /
#    syncTolerations in scripts/render-connectors.py), so it is no longer patched here.
#
# MOVED to node-pool=ks5-nvme (no IP-bound session): instagram-connector (Graph API tokens),
# mcp-server, mcp-sse, brain-windows (INFRA-364; it replaces brain-ingest, whose CronJob was
# retired with the per-message ingest), and the nats/minio backends. nats/minio carry RWO
# Longhorn PVCs but use strategy: Recreate, so the cross-node move is safe. topology:null
# deletes the inherited topology=lan key; mcp-sse also drops its explicit hostname=ubuntu pin.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-mcp-nats
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      nodeSelector:
        topology: null
        node-pool: ks5-nvme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-mcp-minio
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      nodeSelector:
        topology: null
        node-pool: ks5-nvme
        # SC-2842 (23-10): el pin a ks5-cp-2 era provisional porque la imagen solo
        # estaba cacheada en ese nodo y no se podía volver a tirar de docker.io.
        # La imagen ya está espejada en Harbor (harbor.e-dani.com/homelab/minio,
        # ver k8s/base/manifest.yaml), así que cualquier nodo del pool la pulla:
        # cae el pin a hostname.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-connector
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      nodeSelector:
        topology: null
        node-pool: ks5-nvme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      nodeSelector:
        topology: null
        node-pool: ks5-nvme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sse
  namespace: whatsapp-mcp
spec:
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: null
        node-pool: ks5-nvme
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: brain-windows
  namespace: whatsapp-mcp
spec:
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            topology: null
            node-pool: ks5-nvme
