apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifest.yaml
  # Per-account connector workloads, rendered from social-accounts.json by
  # scripts/render-connectors.py (CI fails if stale: --check).
  - generated/connectors.yaml
  - whatsapp-synapse-bridge.yaml
  # DGX-1235 B1: puente de correo.connector.v1 (inerte, replicas 0).
  - correo-bridge.yaml
  # INFRA-364 fase 0: transcripción de notas de voz de WhatsApp (ruta viva +
  # backfill suspendido).
  - whatsapp-voice.yaml
  # SC-2760: la app de WhatsApp del fork de Jordi (apps/whatsapp verbatim) en
  # whatsapp.e-dani.com, a prueba.
  - whatsapp-app.yaml
  - networkpolicy.yaml
  # SC-1197 P3 (SC-1226): API de emparejamientos por sub, inerte (replicas 0, flag off).
  - social-pairing.yaml
  - networkpolicy-social-pairing.yaml
  # INFRA-745: CronJob diario de verificacion facial del grupo Sauvage (A).
  - sauvage-verificacion.yaml

# SC-1144 fase 2: la tabla de vinculos sub->cuentas vive en
# social-identity-bindings.yaml (el fichero checked-in es el trace GitOps: cada
# cambio de vinculo es un git diff). El ConfigMap se renderiza desde ese fichero
# con nombre ESTATICO a proposito (disableNameSuffixHash): el codigo de
# mcp-server/src/domain/identity-bindings.ts relee el fichero montado cuando
# cambia (stat mtime+size), asi que editar un vinculo aplica sin reiniciar el
# pod. Hashearlo forzaria rolls inutilmente — la postura es la misma que la del
# shim de workspace en k8s-agentgateway-pocharlies.
configMapGenerator:
  - name: social-identity-bindings
    files:
      - social-identity-bindings.yaml
  # Registro de cuentas del MCP (mcp-server/src/domain/account-registry.ts):
  # una entrada por instancia de conector. Mismo criterio de nombre estatico:
  # el codigo relee el fichero montado al cambiar (stat mtime+size).
  # Se monta la PROYECCION de runtime (generated/social-accounts.json = el
  # registro sin los bloques `deploy`, que solo consume el renderizador), con la
  # misma clave de fichero que antes.
  - name: social-accounts
    files:
      - social-accounts.json=generated/social-accounts.json
  # INFRA-364 (ADR 0002 §5): bot/monitoring/channel lists and window knobs for
  # the brain-windows jobs. Mismo criterio de nombre estatico que arriba: son
  # listas de datos que los jobs releen en cada pasada.
  - name: brain-windows
    files:
      - brain-windows-config.yaml
  # INFRA-745: prompt de la pasada, criterio de vision y opencode.json del bot
  # Sauvage. Mismo criterio de nombre estatico: cambiar el criterio es un git
  # diff que la proxima pasada lee sin rebuild (patrón brain-windows).
  - name: sauvage-verificacion-prompt
    options:
      labels:
        app: sauvage-verificacion
    files:
      - prompt-pasada.md=sauvage-verificacion/prompt-pasada.md
      - prompt-vision.md=sauvage-verificacion/prompt-vision.md
      - opencode.json=sauvage-verificacion/opencode.json

generatorOptions:
  disableNameSuffixHash: true
