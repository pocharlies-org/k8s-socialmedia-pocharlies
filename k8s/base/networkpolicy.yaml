apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whatsapp-mcp-default-deny-ingress
  namespace: whatsapp-mcp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whatsapp-mcp-allow-same-namespace
  namespace: whatsapp-mcp
spec:
  podSelector: {}
  ingress:
    - from:
        - podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whatsapp-mcp-allow-dashboard-media
  namespace: whatsapp-mcp
spec:
  podSelector:
    matchLabels:
      app: whatsapp-mcp-minio
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: control-nexus
          podSelector:
            matchLabels:
              app: dgx-dashboard-backend
      ports:
        - protocol: TCP
          port: 9000
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whatsapp-mcp-allow-traefik-http
  namespace: whatsapp-mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - whatsapp-connector
          - whatsapp-connector-professional
          - whatsapp-connector-leila
          - mcp-sse
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-lan
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-edge
        - ipBlock:
            cidr: 100.64.0.0/10
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3010
  policyTypes:
    - Ingress
---
# SC-1194 P1: the Instagram Login OAuth callback path on whatsapp.e-dani.com
# routes to instagram-connector:3003. Only the Traefik namespaces may reach it
# (NOT the tailnet/pod CIDR blocks: the connector API is unauthenticated and
# must not become reachable by raw IP — the IngressRoute's exact-path rule is
# the only public door).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whatsapp-mcp-allow-traefik-instagram
  namespace: whatsapp-mcp
spec:
  podSelector:
    matchLabels:
      app: instagram-connector
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-lan
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-edge
      ports:
        - protocol: TCP
          port: 3003
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whatsapp-mcp-allow-dashboard-telegram
  namespace: whatsapp-mcp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - telegram-connector
          - telegram-connector-professional
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: control-nexus
          podSelector:
            matchLabels:
              app: dgx-dashboard-backend
      ports:
        - protocol: TCP
          port: 3002
  policyTypes:
    - Ingress
