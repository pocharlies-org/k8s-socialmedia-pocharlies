
---
apiVersion: v1
kind: Namespace
metadata:
  name: whatsapp-mcp
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: whatsapp-mcp
imagePullSecrets:
  - name: harbor-pull
---
# WhatsApp MCP — multi-connector messaging platform
# Connectors: whatsapp, instagram, telegram; MCP server + SSE bridge
# Stateful: postgres (pgvector), shared Valkey, nats, minio
# Images: harbor.e-dani.com/homelab/whatsappmcp-* — built by GitHub Actions (ubuntu-latest) → push to harbor.e-dani.com

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whatsapp-mcp-secrets
  namespace: whatsapp-mcp
spec:
  refreshInterval: 24h
  secretStoreRef: { name: onepassword, kind: ClusterSecretStore }
  target:
    name: whatsapp-mcp-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: whatsapp-mcp }
  # INFRA-364 (01-10-2026): LLM_API_KEY = virtual key `brain` de LiteLLM (prioridad minima,
  # bot, sin fallback). La lee el LLM de las ventanas del brain; vive en su propio item.
  data:
    - secretKey: LLM_API_KEY
      remoteRef: { key: brain-litellm/api_key }

---
# INFRA-364: URL AMQP del usuario RabbitMQ whatsapp_mcp_brain_windows (vhost
# /synapse; configure ^$, write ^events$, read ^$). El CronJob brain-windows
# publica con el los eventos brain_window.* en Synapse. Item propio: un campo
# nuevo en el item whatsapp-mcp tardaria hasta 96 h en salir de la cache de ESO.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whatsapp-mcp-synapse-rabbitmq
  namespace: whatsapp-mcp
spec:
  refreshInterval: 24h
  secretStoreRef: { name: onepassword, kind: ClusterSecretStore }
  target:
    name: whatsapp-mcp-synapse-rabbitmq
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: url
      remoteRef: { key: whatsapp-mcp-synapse-rabbitmq/url }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-mcp-postgres-data
  namespace: whatsapp-mcp
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
  storageClassName: longhorn

# ── NATS ───────────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-mcp-nats-data
  namespace: whatsapp-mcp
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-mcp-nats
  namespace: whatsapp-mcp
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: whatsapp-mcp-nats } }
  template:
    metadata: { labels: { app: whatsapp-mcp-nats } }
    spec:
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { name: client, containerPort: 4222 }
            - { name: monitor, containerPort: 8222 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: whatsapp-mcp-nats-data }
---
apiVersion: v1
kind: Service
metadata: { name: whatsapp-mcp-nats, namespace: whatsapp-mcp }
spec:
  selector: { app: whatsapp-mcp-nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }

# ── MinIO (media storage) ──────────────────────────────────────────────────────
# Separate instance for WhatsApp media blobs (not the shared MinIO on sauvage backbone)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-mcp-minio-data
  namespace: whatsapp-mcp
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 50Gi } }
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-mcp-minio
  namespace: whatsapp-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy: { type: Recreate }
  selector: { matchLabels: { app: whatsapp-mcp-minio } }
  template:
    metadata: { labels: { app: whatsapp-mcp-minio } }
    spec:
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: minio
          image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          # Digest-pinned: declare the policy explicitly. Git never set it, so
          # ArgoCD never owned the field and a stale `Always` (inherited from an
          # old tag-based deploy) survived forever, re-pulling docker.io on every
          # reschedule -> anonymous Docker Hub rate-limit on the OVH egress.
          imagePullPolicy: IfNotPresent
          args: [server, /data, --console-address, ":9001"]
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: whatsapp-mcp-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: whatsapp-mcp-secrets, key: MINIO_ROOT_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: whatsapp-mcp-minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: whatsapp-mcp-minio, namespace: whatsapp-mcp }
spec:
  selector: { app: whatsapp-mcp-minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-open-worker-profile-professional
  namespace: whatsapp-mcp
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
  storageClassName: longhorn

# ── Per-account connectors (WhatsApp Baileys, Telegram connector + sync) ────
# GENERATED from the account registry: see k8s/base/generated/connectors.yaml
# (scripts/render-connectors.py). Edit k8s/base/social-accounts.json, not here.
---
# ── Brain windows (INFRA-364, ADR 0002): conversation windows into SkirmBrain ─
# Replaces the per-message `brain-ingest` CronJob (retired here on 30-09-2026,
# #144 had already suspended it: Dani's ADR 0002 indexes WhatsApp/Telegram by
# 1-hour-silence windows, parent + 200-400-token children, LLM summaries on
# closed non-bot windows). The old per-message points are purged by the brain
# repo (ADR 0002 §9 fase 1) and the code stays for brain-replay (recovery).
#
# Each pass (mcp-server image: pg + tsx + the jobs):
#   1. reads messages changed after `brain_windows_cursor` (updated_at keyset —
#      edits, deletions, late history syncs and voice notes transcribed hours
#      later all move updated_at, migration 015);
#   2. recomputes the windows of the affected chats and diffs them against
#      `brain_windows`: gone -> delete-document, new/changed -> push-ingest;
#   3. runs the LLM (LiteLLM alias `tooling`, exactly 2 in parallel, closed
#      windows only, capped per pass) and re-pushes the parents with summary.
#
# SUSPENDED ON PURPOSE (Dani's session): the reindex (ADR 0002 §9 fases 2-3,
# k8s/base/brain-windows-backfill.yaml) must land first — running this against
# a brain that still holds the per-message points doubles the noise. Unsuspend
# after the reindex + purge, together with the image re-pin that carries this
# job (the prod overlay pins whatsappmcp-mcp-server for every consumer).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: brain-windows
  namespace: whatsapp-mcp
spec:
  schedule: "*/30 * * * *"
  timeZone: Europe/Madrid
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # 30-min schedule; the job stops itself at MAX_RUNTIME_MS (24 min) so it
      # exits 0 before this deadline. Worst case inside: 100 chats recomputed
      # + 5 LLM windows x (240 s x 3 attempts) / 2 parallel = ~18 min.
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
          containers:
            - name: brain-windows
              image: harbor.e-dani.com/homelab/whatsappmcp-mcp-server:latest
              command:
                - sh
                - -c
                - |
                  cd mcp-server
                  # Guarda de embebido (misma que tenia brain-ingest): sin TEI
                  # el push-ingest solo produce 502; saltarse la pasada no
                  # pierde nada (cursor en brain_windows_cursor).
                  node -e '
                    const url = process.env.BRAIN_URL + "/health";
                    fetch(url, { signal: AbortSignal.timeout(10000) })
                      .then((r) => r.json())
                      .then((d) => {
                        const t = (d && d.tei) || {};
                        if (t.primary_status !== "ok" && t.fallback_status !== "ok") {
                          console.log("brain-windows: sin embeddings (primary=" + t.primary_status + " fallback=" + t.fallback_status + "); se salta esta pasada");
                          process.exit(3);
                        }
                        console.log("brain-windows: embeddings via " + t.active_tei);
                      })
                      .catch((e) => {
                        console.log("brain-windows: /health inalcanzable (" + e.message + "); se salta esta pasada");
                        process.exit(3);
                      });
                  ' || exit 0
                  node --import tsx src/jobs/brain-windows.ts
              env:
                - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
                - { name: BRAIN_URL, value: "http://skirmshop-brain-ingest.skirmshop-brain-prod.svc.cluster.local" }
                # Ventana de reintento del push (pushToBrain, heredada de
                # brain-ingest; la fija brain-ingest-lib.spec). Manda el
                # PRESUPUESTO BRAIN_PUSH_BUDGET_MS (240 s); BRAIN_PUSH_RETRIES
                # es solo techo de seguridad y debe cubrir la ventana: con
                # backoff capped en RETRY_MAX_DELAY (30 s), 20 intentos cubren
                # >240 s. BRAIN_INGEST_MAX_RUNTIME_MS recorta el presupuesto si
                # fuera menor (240 < 300-30: no recorta aqui).
                - { name: BRAIN_PUSH_RETRIES, value: "20" }
                - { name: BRAIN_PUSH_TIMEOUT_MS, value: "90000" }
                - { name: BRAIN_PUSH_RETRY_MAX_DELAY_MS, value: "30000" }
                - { name: BRAIN_PUSH_BUDGET_MS, value: "240000" }
                - { name: BRAIN_PUSH_CONCURRENCY, value: "1" }
                - { name: BRAIN_INGEST_MAX_RUNTIME_MS, value: "300000" }
                # LLM local (ADR 0002 §5): LiteLLM -> residente de los Sparks,
                # alias de capacidad `tooling`. La clave debe ser una virtual de
                # BAJA PRIORIDAD (tipo hermes-batch) via LLM_API_KEY en
                # whatsapp-mcp-secrets; mientras no exista, el codigo cae a
                # OPENAI_API_KEY (la que ya usa mcp-sse contra LiteLLM).
                - { name: LLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000/v1" }
                - { name: LLM_CHAT_MODEL, value: "tooling" }
                # Ventanas y topes por pasada (ADR 0002 §7).
                - { name: BRAIN_WINDOWS_SCAN_ROWS, value: "5000" }
                - { name: BRAIN_WINDOWS_MAX_CHATS, value: "100" }
                - { name: BRAIN_WINDOWS_MAX_LLM, value: "5" }
                - { name: BRAIN_WINDOWS_COLDSTART_LOOKBACK_HOURS, value: "168" }
                - { name: BRAIN_WINDOWS_MAX_RUNTIME_MS, value: "1440000" }
                - { name: BRAIN_WINDOWS_PUSH_DOCS_CAP, value: "400" }
                # INFRA-364: el incremental publica en Synapse
                # (brain_window.<tenant>.upserted|deleted) y Synapse lo ingiere con
                # reintentos (workflows */brain/conversation-window-*.v1.yaml).
                # BRAIN_WINDOWS_SINK=http vuelve al push-ingest directo sin tocar codigo.
                - { name: BRAIN_WINDOWS_SINK, value: "synapse" }
                - name: SYNAPSE_RABBITMQ_URL
                  valueFrom: { secretKeyRef: { name: whatsapp-mcp-synapse-rabbitmq, key: url } }
                # Chats de bot/monitorizacion y canales (se indexan, no pasan
                # por el LLM): ConfigMap brain-windows.
                - { name: BRAIN_WINDOWS_CONFIG_FILE, value: "/brain-config/brain-windows-config.yaml" }
                # Namespaces e instancia del brain por cuenta: registro de cuentas.
                - { name: SOCIAL_ACCOUNTS_FILE, value: "/accounts/social-accounts.json" }
                # BRAIN_API_KEY / OPENAI_API_KEY / LLM_API_KEY salen del
                # secret whatsapp-mcp-secrets (1Password) via envFrom.
              envFrom: [{ secretRef: { name: whatsapp-mcp-secrets } }]
              volumeMounts:
                - { name: accounts, mountPath: /accounts, readOnly: true }
                - { name: brain-config, mountPath: /brain-config, readOnly: true }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { memory: 1Gi }
          volumes:
            - name: accounts
              configMap: { name: social-accounts }
            - name: brain-config
              configMap: { name: brain-windows }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-connector
  namespace: whatsapp-mcp
spec:
  replicas: 1
  selector: { matchLabels: { app: instagram-connector } }
  template:
    metadata: { labels: { app: instagram-connector } }
    spec:
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: instagram-connector
          image: harbor.e-dani.com/homelab/whatsappmcp-instagram-connector:latest
          command: ["sh", "-c", "cd connectors/instagram && node dist/main.js"]
          ports: [{ name: http, containerPort: 3003 }]
          env:
            - { name: NATS_URL, value: "nats://whatsapp-mcp-nats.whatsapp-mcp.svc.cluster.local:4222" }
            # SC-1194 P1: per-sub credential store plumbing (code ships dark).
            # CREDENTIAL_STORE_ENABLED stays explicitly false until PR2 of
            # SC-1144 lands the 007 migration + image pin (devops flips the
            # overlay). DATABASE_URL feeds the store's pool; the connector
            # never opens it while the flag is off. INSTAGRAM_OAUTH_REDIRECT_URI
            # must match a Valid OAuth Redirect URI registered on the Meta app
            # (operator gesture) and is served by the path rule added to the
            # whatsapp-public IngressRoute below.
            - { name: CREDENTIAL_STORE_ENABLED, value: "false" }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
            - { name: INSTAGRAM_OAUTH_REDIRECT_URI, value: "https://whatsapp.e-dani.com/oauth/instagram/callback" }
          envFrom: [{ secretRef: { name: whatsapp-mcp-secrets } }]
          resources:
            requests: { cpu: 30m, memory: 64Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: instagram-connector, namespace: whatsapp-mcp }
spec:
  selector: { app: instagram-connector }
  ports: [{ name: http, port: 3003, targetPort: 3003 }]
---
# MCP server (patched image)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: whatsapp-mcp
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp-server } }
  template:
    metadata:
      labels: { app: mcp-server }
      annotations:
        contracts.e-dani.com/socialmedia-digest: "sha256:8136d67dd12428673b7d6ea4ad9100a93339f1e525f5555073b7c8b9c594a2d5"
    spec:
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: mcp-server
          image: harbor.e-dani.com/homelab/whatsappmcp-mcp-server:latest
          # run from source via tsx (same pattern as the connectors; the image
          # ships source, not a compiled dist)
          command: ["sh", "-c", "cd mcp-server && tsx src/main.ts"]
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: NATS_URL, value: "nats://whatsapp-mcp-nats.whatsapp-mcp.svc.cluster.local:4222" }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
            - { name: WHATSAPP_PROFESSIONAL_URL, value: "http://whatsapp-connector-professional.whatsapp-mcp.svc.cluster.local:3001" }
            - { name: WHATSAPP_LEILA_URL, value: "http://whatsapp-connector-leila.whatsapp-mcp.svc.cluster.local:3001" }
            - { name: S3_ENDPOINT, value: "http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000" }
            - { name: S3_BUCKET, value: "skirmshop-drive" }
            - { name: S3_REGION, value: "us-east-1" }
            - { name: S3_PREFIX, value: "socialmedia" }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-socialmedia, key: AWS_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-socialmedia, key: AWS_SECRET_ACCESS_KEY } } }
            - { name: LEGACY_MINIO_ENDPOINT, value: "whatsapp-mcp-minio.whatsapp-mcp.svc.cluster.local:9000" }
            - { name: LEGACY_MINIO_ACCESS_KEY, value: "$(MINIO_ROOT_USER)" }
            - { name: LEGACY_MINIO_SECRET_KEY, value: "$(MINIO_ROOT_PASSWORD)" }
            - { name: LEGACY_MINIO_USE_SSL, value: "false" }
            - { name: LEGACY_MINIO_BUCKET, value: "socialmedia-media" }
            - { name: EMBEDDING_BASE_URL, value: "http://bge-m3-embedding.llm.svc.cluster.local:8000/v1" }
            - { name: EMBEDDING_MODEL, value: "bge-m3" }
            - { name: EMBEDDING_DIMENSION, value: "1024" }
            # Registro de cuentas (k8s/base/social-accounts.json -> ConfigMap
            # social-accounts): namespaces validos para la ingesta.
            - { name: SOCIAL_ACCOUNTS_FILE, value: "/accounts/social-accounts.json" }
          envFrom: [{ secretRef: { name: whatsapp-mcp-secrets } }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: accounts
              mountPath: /accounts
              readOnly: true
      volumes:
        - name: accounts
          configMap: { name: social-accounts }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-server, namespace: whatsapp-mcp }
spec:
  selector: { app: mcp-server }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
# MCP SSE bridge for existing clients using x86:3010/sse
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sse
  namespace: whatsapp-mcp
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: mcp-sse } }
  template:
    metadata:
      labels: { app: mcp-sse }
      annotations:
        contracts.e-dani.com/socialmedia-digest: "sha256:8136d67dd12428673b7d6ea4ad9100a93339f1e525f5555073b7c8b9c594a2d5"
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: ubuntu
        kubernetes.io/arch: amd64
      containers:
        - name: mcp-sse
          image: harbor.e-dani.com/homelab/whatsappmcp-mcp-server:latest
          command: ["sh", "-c", "cd mcp-server && tsx src/mcp/sse-server.ts"]
          ports:
            - { name: sse, containerPort: 3010, hostPort: 3010 }
          env:
            - { name: MCP_SSE_PORT, value: "3010" }
            # Reclaim idle Streamable-HTTP sessions (no open notification stream +
            # idle > this) so orphaned sessions don't leak heap until the 6h max-age.
            # Tunable without an image rebuild. Also: SSE_STREAMABLE_SWEEP_MS (60s),
            # SSE_STREAMABLE_MAX_SESSIONS (100) default in code.
            - { name: SSE_STREAMABLE_IDLE_MS, value: "600000" }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
            - name: SHARED_VALKEY_SOCIALMEDIA_PASSWORD
              valueFrom: { secretKeyRef: { name: socialmedia-shared-valkey, key: password } }
            - { name: REDIS_URL, value: "redis://socialmedia:$(SHARED_VALKEY_SOCIALMEDIA_PASSWORD)@shared-valkey-master.databases.svc.cluster.local:6379/0" }
            - { name: CONNECTOR_URL, value: "http://whatsapp-connector.whatsapp-mcp.svc.cluster.local:3001" }
            - { name: WHATSAPP_PROFESSIONAL_URL, value: "http://whatsapp-connector-professional.whatsapp-mcp.svc.cluster.local:3001" }
            - { name: WHATSAPP_LEILA_URL, value: "http://whatsapp-connector-leila.whatsapp-mcp.svc.cluster.local:3001" }
            # SC-1144 fase 2: vinculos sub->cuentas (k8s/base/social-identity-bindings.yaml
            # -> ConfigMap social-identity-bindings, montado en /identity). La bandera
            # sale OFF del repo: con OFF el enrutado es byte-identico al de hoy (cero
            # lecturas del fichero). Volcarla a "on" es decision del operador, y exige
            # que el llamante traiga el x-user-sub que estampa el AgentGateway — por la
            # LAN con el bearer compartido no hay sub => fail-closed. Ver el riesgo
            # residual documentado en CLAUDE.md (lo cierra SC-1146, parte 5).
            - { name: SOCIAL_IDENTITY_BINDING, value: "off" }
            - { name: SOCIAL_IDENTITY_BINDINGS_FILE, value: "/identity/social-identity-bindings.yaml" }
            # Registro de cuentas: catalogo, enrutado a conectores, health y
            # politica de envio en frio salen de aqui (account-registry.ts).
            - { name: SOCIAL_ACCOUNTS_FILE, value: "/accounts/social-accounts.json" }
            - { name: TELEGRAM_CONNECTOR_URL, value: "http://telegram-connector.whatsapp-mcp.svc.cluster.local:3002" }
            - { name: INSTAGRAM_CONNECTOR_URL, value: "http://instagram-connector.whatsapp-mcp.svc.cluster.local:3003" }
            - { name: LLM_BASE_URL, value: "http://litellm.litellm.svc.cluster.local:4000/v1" }
            - { name: LLM_CHAT_MODEL, value: "tooling" }
            - { name: S3_ENDPOINT, value: "http://skirmshop-drive-s3.backup-hub.svc.cluster.local:9000" }
            - { name: S3_BUCKET, value: "skirmshop-drive" }
            - { name: S3_REGION, value: "us-east-1" }
            - { name: S3_PREFIX, value: "socialmedia" }
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-socialmedia, key: AWS_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: skirmshop-drive-s3-socialmedia, key: AWS_SECRET_ACCESS_KEY } } }
            - { name: LEGACY_MINIO_ENDPOINT, value: "whatsapp-mcp-minio.whatsapp-mcp.svc.cluster.local:9000" }
            - { name: LEGACY_MINIO_ACCESS_KEY, value: "$(MINIO_ROOT_USER)" }
            - { name: LEGACY_MINIO_SECRET_KEY, value: "$(MINIO_ROOT_PASSWORD)" }
            - { name: LEGACY_MINIO_USE_SSL, value: "false" }
            - { name: LEGACY_MINIO_BUCKET, value: "socialmedia-media" }
            - { name: EMBEDDING_BASE_URL, value: "http://bge-m3-embedding.llm.svc.cluster.local:8000/v1" }
            - { name: EMBEDDING_MODEL, value: "bge-m3" }
            - name: MCP_SSE_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: whatsapp-mcp-sse-secrets, key: MCP_SSE_AUTH_TOKEN } }
          envFrom: [{ secretRef: { name: whatsapp-mcp-secrets } }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3010 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3010 }
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: identity
              mountPath: /identity
              readOnly: true
            - name: accounts
              mountPath: /accounts
              readOnly: true
      volumes:
        - name: accounts
          configMap: { name: social-accounts }
        # SC-1144 fase 2: la tabla de vinculos sub->cuentas (ConfigMap generado
        # desde k8s/base/social-identity-bindings.yaml por el kustomization de
        # base, nombre estatico a proposito: el codigo relee el fichero montado
        # al cambiar, asi editar un vinculo no reinicia el pod).
        - name: identity
          configMap: { name: social-identity-bindings }
---
apiVersion: v1
kind: Service
metadata: { name: mcp-sse, namespace: whatsapp-mcp }
spec:
  selector: { app: mcp-sse }
  ports: [{ name: sse, port: 3010, targetPort: 3010 }]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whatsapp-public
  namespace: whatsapp-mcp
  annotations:
    external-dns.alpha.kubernetes.io/hostname: whatsapp.e-dani.com
    external-dns.alpha.kubernetes.io/target: "57.129.17.172"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
spec:
  entryPoints: [websecure]
  ingressClassName: traefik-edge
  routes:
    # SC-1194 P1: the Instagram Login OAuth callback (user's browser lands here
    # after consent). Path-scoped to the single callback route so nothing else
    # of the instagram connector's internal API becomes public; the connector
    # answers it with the whatsapp-public host already provisioned (DNS, cert,
    # Cloudflare). Traefik prefers the more specific rule over the Host-only
    # one below.
    - match: Host(`whatsapp.e-dani.com`) && Path(`/oauth/instagram/callback`)
      kind: Rule
      services:
        - name: instagram-connector
          port: 3003
    - match: Host(`whatsapp.e-dani.com`) && PathPrefix(`/api/public`)
      kind: Rule
      middlewares:
        - { name: connector-public-api-deny, namespace: whatsapp-mcp }
      services:
        - name: whatsapp-connector
          port: 3001
    # Everything else (QR page, status) only behind the generic Keycloak chain:
    # this host is internet-facing through Cloudflare.
    - match: Host(`whatsapp.e-dani.com`)
      kind: Rule
      middlewares:
        - { name: sso-chain, namespace: keycloak }
      services:
        - name: whatsapp-connector
          port: 3001
  tls:
    store: { name: default, namespace: traefik-edge }
---
# Deny-all for the connector's unauthenticated /api/public/* surface (chat list,
# full history, media backfill). In-cluster consumers (mcp-server) reach the
# Service directly and never cross an IngressRoute, so no ingress host needs it.
# ipAllowList with loopback only: every real client gets 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: connector-public-api-deny
  namespace: whatsapp-mcp
spec:
  ipAllowList:
    sourceRange: ["127.0.0.1/32"]
---
# LAN-only IngressRoute for the MCP SSE server (port 3010) — so Claude/Codex
# clients on any LAN/Tailscale host (pc, mac, dgx, dgx2, x86, sauvage) can
# reach it over HTTPS without exposing it to the public internet. Auth is the
# Bearer MCP_SSE_AUTH_TOKEN from whatsapp-mcp-sse-secrets (already enforced
# by the server when the env var is set).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp-socialmedia-lan
  namespace: whatsapp-mcp
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`mcp-socialmedia.lan.e-dani.com`)
      kind: Rule
      services:
        - name: mcp-sse
          port: 3010
  tls:
    store: { name: default, namespace: traefik-lan }
---
# ── SC-705 / SC-1214: GitOps application of the DB migrations (idempotent) ───
# migrate.ts keeps a `_migrations` ledger: recorded files are skipped, a
# pre-ledger schema is BASELINED (recorded without executing), and each new
# file runs in its own transaction — so this Job is safe on every sync
# (architect verdict SC-1144, 21-09). It returns together with the image
# re-pin that carries migrations/007_user_channel_credentials.sql, the
# precondition that made the original deferral necessary (a failing PreSync
# blocks the whole `socialmedia` sync).
# ArgoCD PreSync hook: executes BEFORE the workloads sync (the credential
# store must find table 007 once PR-2 turns CREDENTIAL_STORE_ENABLED on).
# Fixed metadata.name: the Job is removed before each new sync and again on
# success — hook-delete-policy BeforeHookCreation,HookSucceeded, the company
# pattern (only HookSucceeded/HookFailed/BeforeHookCreation are valid values;
# anything else ArgoCD drops falls back to BeforeHookCreation, so a completed
# Job would linger and mark the app OutOfSync). ttlSecondsAfterFinished: 3600
# as backstop.
# Image = mcp-server (ships src + tsx); the prod overlay `images:` pin
# rewrites its tag+digest exactly as for the mcp-server Deployment. The
# $(DB_USER)/$(DB_PASSWORD) expansion in DATABASE_URL is done by the kubelet
# from the envFrom secret (measured in a live pod, SC-1214 pasada 2).
apiVersion: batch/v1
kind: Job
metadata:
  name: whatsapp-mcp-migrate
  namespace: whatsapp-mcp
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: migrate
          image: harbor.e-dani.com/homelab/whatsappmcp-mcp-server:latest
          command: ["sh", "-c", "cd mcp-server && tsx src/infrastructure/database/migrate.ts"]
          env:
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
          envFrom: [{ secretRef: { name: whatsapp-mcp-secrets } }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
