# SC-4304 S8: backfill del historial de mensajes en Hindsight (banco `personal`, estrategia vector) por el
# escritor del boundary. Va en la kustomization desde que la imagen pineada lleva el script (v1.3.139).
#
# Un Job por pasada, de nombre versionado: el spec de un Job es inmutable, así que una pasada nueva es un
# nombre nuevo (-2, -3…) por PR, nunca un cambio en sitio. Sin TTL: ArgoCD no lo recrea al acabar.
#   -1  MAX_ITEMS=200: primer lote, hecho (80 ventanas, 552 chunks, todo 200 en el sidecar). Ya borrado de los
#       manifiestos: el cursor (brain_windows_backfill_cursor, RUN_ID sc4304-hindsight) vive en la BD, no en el Job.
#   -2  MAX_ITEMS=0, 2 conexiones: arrancó 18:45Z y paró solo a los 50 min con `done: false`. Ya no está en los
#       manifiestos; el cursor (BD) conserva dónde quedó.
#   -3  MAX_ITEMS=0, 2 conexiones: arrancó 19:44Z y paró solo a los 50 min con `done: false`. Ya no está en los
#       manifiestos; el cursor (BD) conserva dónde quedó.
#   -4  Mismas condiciones (MAX_ITEMS=0, 2 conexiones): retoma desde el cursor. Si acabara con `done: false`, el
#       siguiente es un Job de nombre nuevo (-5…), nunca un cambio en sitio. No se fusiona mientras el Job anterior
#       siga activo: dos Jobs a la vez serían 4 conexiones contra los 4 slots del escritor.
# La imagen va fijada por tag@digest (nunca :latest; condición de security). Un 401/403 del escritor (el token no
# casa con la identidad) para al instante y no se reintenta.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-chunks-backfill-4
  namespace: whatsapp-mcp
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: backfill
          image: harbor.e-dani.com/homelab/whatsappmcp-mcp-server:v1.3.139@sha256:e36b7a76ca67776915e99b63684c942f74c197b3b2112de164b12477fcf69794
          command: ["sh", "-c", "cd mcp-server && node --import tsx src/jobs/hindsight-chunks-backfill.ts"]
          env:
            # Solo DB_USER y DB_PASSWORD de whatsapp-mcp-secrets, nunca el Secret entero (40 claves): este Job
            # no necesita ninguna otra y la de escritura de Hindsight es la suya (security, SC-4304).
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: whatsapp-mcp-secrets, key: DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: whatsapp-mcp-secrets, key: DB_PASSWORD } }
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
            - { name: HINDSIGHT_WRITER_URL, value: "https://hindsight-writer.hindsight.svc:8443" }
            - { name: NODE_EXTRA_CA_CERTS, value: "/hindsight-ca/ca.crt" }
            - { name: ACCOUNTS, value: "personal" }
            - { name: MAX_ITEMS, value: "0" }
            - { name: MAX_RUNTIME_MS, value: "3000000" }
            - name: HINDSIGHT_WRITER_TOKEN
              valueFrom: { secretKeyRef: { name: hindsight-writer-socialmedia-mensajes, key: HINDSIGHT_WRITER_TOKEN } }
          volumeMounts:
            - { name: hindsight-ca, mountPath: /hindsight-ca, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 2Gi }
      volumes:
        - name: hindsight-ca
          configMap: { name: hindsight-writer-ca }
