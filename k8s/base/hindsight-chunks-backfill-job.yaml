# SC-4304 S8: backfill del historial de mensajes en Hindsight (banco `personal`, estrategia vector) por el
# escritor del boundary. Igual que brain-windows-backfill.yaml, NO va en la kustomization hasta que la imagen
# pineada lleve el script (un Job con la imagen vieja falla por módulo inexistente y su nombre ya no vuelve a
# servir): el PR de pin de imagen lo añade a `resources`.
#
# Un Job por pasada, de nombre versionado: el spec de un Job es inmutable, así que una pasada nueva es un
# nombre nuevo (-2, -3…) por PR, nunca un cambio en sitio. Sin TTL: ArgoCD no lo recrea al acabar.
#   -1  MAX_ITEMS=200: primer lote pequeño. Se comprueba su 200 en el log del sidecar `hindsight-writer`
#       (identity=socialmedia-mensajes) y que los documentos aparecen en el banco antes de seguir.
#   -2  MAX_ITEMS=0: el resto. El cursor (brain_windows_backfill_cursor, RUN_ID sc4304-hindsight) retoma donde
#       quedó el anterior; relanzar solo repite el último lote, que es idempotente por document_id.
# Un 401/403 del escritor (el token no casa con la identidad) para al instante y no se reintenta.
apiVersion: batch/v1
kind: Job
metadata:
  name: hindsight-chunks-backfill-1
  namespace: whatsapp-mcp
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector: { topology: lan, kubernetes.io/arch: amd64 }
      containers:
        - name: backfill
          image: harbor.e-dani.com/homelab/whatsappmcp-mcp-server:latest
          command: ["sh", "-c", "cd mcp-server && node --import tsx src/jobs/hindsight-chunks-backfill.ts"]
          env:
            - { name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-shared-rw.databases.svc.cluster.local:5432/whatsappmcp" }
            - { name: HINDSIGHT_WRITER_URL, value: "https://hindsight-writer.hindsight.svc:8443" }
            - { name: NODE_EXTRA_CA_CERTS, value: "/hindsight-ca/ca.crt" }
            - { name: ACCOUNTS, value: "personal" }
            - { name: MAX_ITEMS, value: "200" }
            - { name: MAX_RUNTIME_MS, value: "3000000" }
            - name: HINDSIGHT_WRITER_TOKEN
              valueFrom: { secretKeyRef: { name: hindsight-writer-socialmedia-mensajes, key: HINDSIGHT_WRITER_TOKEN } }
          envFrom: [{ secretRef: { name: whatsapp-mcp-secrets } }]
          volumeMounts:
            - { name: hindsight-ca, mountPath: /hindsight-ca, readOnly: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 2Gi }
      volumes:
        - name: hindsight-ca
          configMap: { name: hindsight-writer-ca }
